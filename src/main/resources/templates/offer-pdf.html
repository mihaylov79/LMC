<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8" />
    <title th:text="'Оферта ' + ${offer.offerNumber}">Оферта</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 10mm 10mm 20mm 10mm;
            @bottom-center {
                content: counter(page) " / " counter(pages);
                font-size: 10pt;
                font-weight: bold;
                color: #000;
            }
        }

        body {
            font-family: 'DejaVu Sans', sans-serif;
            font-size: 10pt;
            color: #000;
            line-height: 1.4;
        }

        .header {
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .logo {
            max-width: 120px;
            max-height: 60px;
            float: left;
            margin-right: 20px;
            margin-bottom: 5px;
        }

        .header-content {
            text-align: center;
        }

        .config-image {
            max-width: 200px;
            max-height: 200px;
            display: inline-block;
            border: 1px solid #ddd;
        }

        .image-container {
            text-align: center;
            width: 100%;
            margin: 15px 0;
        }

        h1 {
            font-size: 18pt;
            margin: 5px 0;
        }

        h2 {
            font-size: 12pt;
            margin: 10px 0 5px 0;
            border-bottom: 1px solid #999;
        }

        .client-info {
            text-align: right;
            margin-bottom: 30px;
        }

        .client-info h2 {
            border-bottom: none;
            margin: 0 0 10px 0;
        }

        .client-info p {
            margin: 3px 0;
        }

        .intro-text {
            font-size: 11pt;
            margin-top: 30px;
            margin-bottom: 15px;
            font-style: italic;
            color: #333;
            text-align: center;
            font-weight: bold;
        }

        .system-name {
            font-size: 14pt;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            color: #000;
        }

        h3 {
            font-size: 10pt;
            margin: 20px 0 10px 0;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 9pt;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 5px 8px;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
            font-weight: bold;
        }

        tr {
            page-break-inside: avoid;
            page-break-after: auto;
        }

        thead {
            display: table-header-group;
        }

        tbody tr {
            page-break-inside: avoid;
        }

        .totals-table {
            width: 60%;
            margin-left: auto;
            margin-top: 20px;
            border-collapse: collapse;
        }

        .totals-table td {
            padding: 5px 10px;
            border-bottom: 1px solid #ddd;
        }

        .totals-table td:last-child {
            text-align: right;
        }

        .total-row {
            font-size: 12pt;
            border-top: 2px solid #333 !important;
        }

        .footer {
            margin-top: 30px;
            font-size: 9pt;
            color: #666;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
    </style>
</head>
<body>
<!-- Header -->
<div class="header">
    <img th:if="${logoBase64}" th:src="'data:image/png;base64,' + ${logoBase64}" alt="Logo" class="logo" />
    <div class="header-content">
        <h1>ОФЕРТА</h1>
        <p><strong>№:</strong> <span th:text="${offer.offerNumber}"></span> <span style="display:inline-block; width:30px;"></span> <strong>Дата:</strong> <span th:text="${#temporals.format(offer.created, 'dd.MM.yyyy')}"></span></p>
    </div>
</div>

<!-- Клиент информация -->
<div class="client-info">
    <h2>До</h2>
    <p th:text="${offer.company.companyName}"></p>
    <p th:if="${offer.company.address}" th:text="${offer.company.address}"></p>
</div>

<!-- Конфигурация детайли -->
<div class="configuration">
    <p class="intro-text">Имаме удоволствието да представим на Вашето внимание:</p>
    <p class="system-name" th:text="${snapshot.description}"></p>

    <!-- Картинка на конфигурацията -->
    <div class="image-container" th:if="${configImageUrl}">
        <img th:src="${configImageUrl}"
             alt="Конфигурация"
             class="config-image" />
    </div>

    <h3>Компоненти на системата:</h3>
    <table>
        <thead>
        <tr>
            <th>№</th>
            <th>Код</th>
            <th>Компонент</th>
            <th style="text-align:center">бр</th>
            <th style="text-align:right">Цена</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="unit, stat : ${snapshot.includedUnits}">
            <!-- Главен ред с компонента -->
            <tr style="font-weight: bold;">
                <td th:text="${stat.count}"></td>
                <td th:text="${unit.configurableUnitCode}"></td>
                <td th:text="${unit.unitName}"></td>
                <td style="text-align:center" th:text="${unit.quantity}"></td>
                <td style="text-align:right">
                    <span th:text="${#numbers.formatDecimal(unit.unitPrice, 1, 2)}"></span>
                    <span th:text="' ' + ${offer.currency}"></span>
                </td>
            </tr>

            <tr th:each="option : ${unit.options}"
                style="background-color: #f9f9f9;">
                <td></td>
                <td></td>
                <td style="padding-left: 25px; font-size: 0.9em;">
                    <span style="color: #888;">├─</span>
                    <span th:text="${option.optionName}"></span>
                    <span style="color: #999;" th:if="${option.quantity}">
                        [qty: <span th:text="${option.quantity}"></span>]
                    </span>
                </td>
                <td></td>
                <td></td>
            </tr>
        </th:block>
        </tbody>
    </table>
</div>

<!-- Ценови детайли -->
<div class="pricing">
    <table class="totals-table">
        <tr>
            <td>Конфигурация:</td>
            <td>
                <span th:text="${#numbers.formatDecimal(snapshot.totalPrice, 1, 2)}"></span>
                <span th:text="' ' + ${offer.currency}"></span>
            </td>
        </tr>
        <tr th:if="${offer.deliveryFee > 0}">
            <td>Доставка:</td>
            <td>
                <span th:text="${#numbers.formatDecimal(offer.deliveryFee, 1, 2)}"></span>
                <span th:text="' ' + ${offer.currency}"></span>
            </td>
        </tr>
        <tr th:if="${offer.installationFee > 0}">
            <td>Монтаж:</td>
            <td>
                <span th:text="${#numbers.formatDecimal(offer.installationFee, 1, 2)}"></span>
                <span th:text="' ' + ${offer.currency}"></span>
            </td>
        </tr>
        <tr th:if="${offer.installationMaterials > 0}">
            <td>Материали:</td>
            <td>
                <span th:text="${#numbers.formatDecimal(offer.installationMaterials, 1, 2)}"></span>
                <span th:text="' ' + ${offer.currency}"></span>
            </td>
        </tr>
        <tr th:if="${offer.discount > 0}">
            <td>Отстъпка (%):</td>
            <td th:text="${offer.discount} + '%'"></td>
        </tr>
        <tr class="total-row">
            <td><strong>ОБЩО:</strong></td>
            <td>
                <strong>
                    <span th:text="${#numbers.formatDecimal(finalPrice, 1, 2)}"></span>
                    <span th:text="' ' + ${offer.currency}"></span>
                </strong>
            </td>
        </tr>
        <tr>
            <td colspan="2" style="text-align: right; font-style: italic; color: #666; border: none; padding-top: 5px;">
                *Посочените цени са без ДДС
            </td>
        </tr>
    </table>
</div>

<!-- Footer -->
<div class="footer">
    <p>Валидна до: <span th:text="${#temporals.format(offer.expires, 'dd.MM.yyyy')}"></span></p>
    <p>Подготвил: <span th:text="${offer.createdBy.firstName} + ' ' + ${offer.createdBy.lastName}"></span></p>
</div>
</body>
</html>
