<!-- language: html -->
<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Създай Конфигурируема Единица</title>
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/new-configurable-unit.css">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div class="header-container">
    <th:block th:insert="~{fragments/nav :: nav}"></th:block>
</div>

<div class="form-container">
    <h2 class="form-title">Създай Конфигурируема Единица</h2>

    <form th:action="@{/products/configurable-units/create}"
          th:object="${request}"
          th:method="POST"
          id="create-configurable-unit-form">

        <!-- Избор на базов продукт -->
        <div class="form-group">
            <label for="unitId">Изберете базов продукт: *</label>
            <select id="unitId" th:field="*{unitId}" required>
                <option value="">-- Изберете продукт --</option>
                <option th:each="unit : ${allUnits}"
                        th:value="${unit.id}"
                        th:text="${unit.code + ' - ' + unit.name + ' (' + unit.price + ' ' + unit.currency + ')'}">
                </option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('unitId')}" th:errors="*{unitId}"></span>
        </div>

        <!-- Избор на опции (с количество) -->
        <div class="form-group">
            <label>Опции (незадължително):</label>
            <div class="options-group">
                <div class="option-item" th:each="option, stat : ${allOptions}">
                    <input type="checkbox"
                           th:id="${'opt_' + option.id}"
                           class="opt-checkbox">
                    <label class="option-label" th:for="${'opt_' + option.id}">
                        <div class="option-name" th:text="${option.code + ' - ' + option.name}"></div>
                        <div class="option-details">
                            <span th:text="${option.price + ' ' + option.currency}"></span>
                            <span> | </span>
                            <span th:text="${option.compatibleWith}"></span>
                        </div>
                    </label>

                    <!-- Server binding inputs: optionId + quantity -->
                    <input type="hidden"
                           th:name="${'optionIds[' + stat.index + '].optionId'}"
                           th:value="${option.id}"/>
                    <input type="number"
                           min="1"
                           th:name="${'optionIds[' + stat.index + '].quantity'}"
                           value="1"
                           class="option-qty"
                           style="width:4rem"/>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Създай</button>
            <a th:href="@{/home}" class="btn btn-secondary">Откажи</a>
        </div>
    </form>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
        const form = document.getElementById('create-configurable-unit-form');
        if (!form) return;

        form.addEventListener('submit', function () {
            document.querySelectorAll('.options-group .option-item').forEach((el) => {
                const cb = el.querySelector('.opt-checkbox');
                const hiddenId = el.querySelector('input[type="hidden"][name^="optionIds"]');
                const qty = el.querySelector('input.option-qty');
                if (!cb.checked) {
                    if (hiddenId) hiddenId.disabled = true;
                    if (qty) qty.disabled = true;
                } else {
                    // ensure quantity at least 1
                    if (qty && (!qty.value || Number(qty.value) < 1)) {
                        qty.value = 1;
                    }
                }
            });
        });

        // toggle qty disabled state when checkbox toggled (UX)
        document.querySelectorAll('.options-group .option-item').forEach((el) => {
            const cb = el.querySelector('.opt-checkbox');
            const qty = el.querySelector('input.option-qty');
            if (cb && qty) {
                cb.addEventListener('change', () => {
                    qty.disabled = !cb.checked;
                });
                // initialize
                qty.disabled = !cb.checked;
            }
        });
    })();
    /*]]>*/
</script>

</body>
</html>
