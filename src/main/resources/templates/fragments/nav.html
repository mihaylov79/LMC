<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Navigation Bar</title>
    <link rel="stylesheet" href="/css/menu.css">
</head>
<body>

    <nav class="menu">
        <ul>
<!--            <li><a th:href="@{/}">Начало</a></li>-->
            <li sec:authorize="isAuthenticated()"><a th:href="@{/home}">Начало</a></li>
            <li sec:authorize="isAuthenticated()"><a th:href="@{/companies}">Фирми</a></li>
            <li sec:authorize="hasAnyRole('ADMIN')"><a th:href="@{/users/list}">Потребители</a></li>
            <li sec:authorize="hasAnyRole('ADMIN')"><a th:href="@{/products}">Продукти</a></li>
            <li sec:authorize="hasAnyRole('ADMIN')"><a th:href="@{/products/configurable-units}">Модули</a></li>
            <li sec:authorize="hasAnyRole('ADMIN')"><a th:href="@{/currency-fixings}">Валутни курсове</a></li>
            <li sec:authorize="isAnonymous()"><a th:href="@{/login}">Вход</a></li>
            <li sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" th:method="POST" class="logout-form" style="display: inline;">
                    <button type="submit" class="logout-btn">Изход</button>
                </form>
            </li>
<!--            <li sec:authorize="isAuthenticated()"><a th:href="@{/logout}">Изход</a></li>-->
        </ul>
    </nav>

</body>
</html>
