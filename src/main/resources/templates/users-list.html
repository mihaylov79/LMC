<!-- html -->
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Потребители</title>
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/units.css">
    <link rel="stylesheet" href="/css/users-list.css">
</head>
<body>
<div class="header-container">
    <th:block th:insert="~{fragments/nav :: nav}"></th:block>
</div>

<div class="front-container">

    <th:block th:insert="~{fragments/user-info :: userInfo}"></th:block>

    <div class="tabs">
        <div class="configurations">
            <div class="menu">
                <ul>
                    <li><a th:href="@{/users/create/new}">Създай нов потребител</a></li>
                </ul>
            </div>

            <div class="configurations-table">
                <div class="table-header">
                    <div class="search-box">
                        <input type="text" id="searchConfigurations" placeholder="Търси потребител...">
                    </div>
                    <h3 class="table-title">Потребители</h3>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>Поща</th>
                        <th>Име</th>
                        <th>Фамилия</th>
                        <th>Роля</th>
                        <th>Статус</th>
                        <th>Действие</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="listUser : ${users}">
                        <td th:text="${listUser.email}"></td>
                        <td th:text="${listUser.firstName}"></td>
                        <td th:text="${listUser.lastName}"></td>

                        <!-- Role selector + update form -->
                        <td>
                            <form th:action="@{/users/update-role/{userId}(userId=${listUser.id})}"
                                  th:method="PUT"
                                  style="display:inline;"
                                  class="role-form">
                                <select class="role-select"
                                        th:data-original-role="${listUser.userRole.name()}"
                                        th:id="'role-' + ${listUser.id}"
                                        name="role">
                                    <option th:each="role : ${T(lmc.user.model.UserRole).values()}"
                                            th:value="${role.name()}"
                                            th:text="${role.description}"
                                            th:selected="${role.name() == listUser.userRole.name()}">
                                    </option>
                                </select>

                                <button type="submit"
                                        class="action-btn tick-btn"
                                        th:attr="id=${'tick-' + listUser.id}"
                                        disabled
                                        title="Запазване на новата роля">
                                    ✓
                                </button>
                            </form>
                        </td>

                        <td th:text="${listUser.status.description}"></td>
                        <td>
                            <form th:action="@{/users/change-status/{userId}(userId=${listUser.id})}"
                                  th:method="put"
                                  style="display:inline;"
                                  onsubmit="return confirm('Сигурни ли сте, че искате да промените статуса на потребителя?');">
                                <button type="submit" class="action-btn"
                                        th:text="${listUser.status.name() == 'ACTIVE' ? 'Деактивирай' : 'Активирай'}">
                                    Деактивирай
                                </button>
                            </form>

                            <form th:action="@{/users/reset-password/{id}(id=${listUser.id})}"
                                  th:method="PUT"
                                  style="display:inline;"
                                  onsubmit="return confirm('Ще бъде генерирана нова парола за потребителя. Продължавате ли?');">
                                <button type="submit" class="action-btn">Нулиране на парола</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // enable/disable tick button only when role changed
        document.querySelectorAll('.role-form').forEach(function (form) {
            const select = form.querySelector('.role-select');
            const tick = form.querySelector('.tick-btn');

            const original = (select.dataset.originalRole || '').trim();
            const current = () => (select.value || '').trim();

            // initialize button state
            tick.disabled = (current() === original);

            select.addEventListener('change', function () {
                tick.disabled = (current() === original);
            });

            // prevent submit when nothing changed (safety)
            form.addEventListener('submit', function (e) {
                if (current() === original) {
                    e.preventDefault();
                }
            });
        });

        // Search box
        const searchInput = document.getElementById('searchConfigurations');
        if (searchInput) {
            searchInput.addEventListener('keyup', function () {
                const searchValue = this.value.toLowerCase();
                const rows = document.querySelectorAll('.configurations-table tbody tr');

                rows.forEach(row => {
                    const email = (row.cells[0]?.textContent || '').toLowerCase();
                    const firstName = (row.cells[1]?.textContent || '').toLowerCase();
                    const lastName = (row.cells[2]?.textContent || '').toLowerCase();
                    const userRole = (row.cells[3]?.textContent || '').toLowerCase();
                    const status = (row.cells[4]?.textContent || '').toLowerCase();

                    if (email.includes(searchValue) || firstName.includes(searchValue) || lastName.includes(searchValue) || userRole.includes(searchValue) || status.includes(searchValue)) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });
        }
    });
</script>
</body>
</html>
