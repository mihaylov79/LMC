<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Edit Configuration</title>
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/edit-configuration.css">
</head>
<body>
<div class="header-container">
    <th:block th:insert="~{fragments/nav :: nav}"></th:block>
</div>
<h1>Редактирай конфигурация</h1>

<form th:action="@{|/configurations/edit/${configurationId}|}" th:object="${configuration}" th:attr="data-id=${configurationId}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <label>Линк на изображението: <input type="text" th:field="*{imgUrl}"/></label><br/>
    <label>Код: <input type="text" th:field="*{code}"/></label><br/>
    <label>Линия: <select th:field="*{line}">
        <option th:each="l : ${T(lmc.configuration.model.MachineLine).values()}"
                th:value="${l}" th:text="${l}"></option>
    </select></label><br/>
    <label>Type: <select th:field="*{type}">
        <option th:each="t : ${T(lmc.configuration.model.MachineType).values()}"
                th:value="${t}" th:text="${t}"></option>
    </select></label><br/>
    <label>Описание:<br/>
        <textarea th:field="*{description}"></textarea>
    </label><br/>
    <label>Модел: <input type="text" th:field="*{model}"/></label><br/>

    <h3>Елементи на конфигурацията</h3>
    <div id="units-list">
        <div th:each="u,iterStat : *{units}">
            <span th:text="${u.displayLabel != null && u.displayLabel != '' ? u.displayLabel : u.configurableUnitId}">unit-label</span>
            <span> qty: <span th:text="${u.quantity}">1</span></span>
            <button type="button" th:attr="data-id=${u.configurableUnitId}" onclick="removeUnit(this)">Remove 1</button>
        </div>
    </div>

    <h4>Добави елемент</h4>
    <select id="add-unit-select">
        <option th:each="cu : ${existingUnits}" th:value="${cu.id}" th:text="${cu.code + ' - ' + (cu.unit != null ? cu.unit.name : '')}"></option>
    </select>
    <input id="add-qty" type="number" value="1" min="1"/>
    <button type="button" onclick="addUnit()">Добави</button>

    <br/><br/>
    <button type="submit">Запази</button>
</form>

<script th:inline="javascript">
    /*<![CDATA[*/
    // try Thymeleaf value first; if empty, fallback to data-id attribute on form
    const configurationId = (/*[[${configurationId}]]*/ '') || document.querySelector('form').dataset.id;

    // read CSRF metadata inserted in <head>
    const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
    const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
    const csrfToken = csrfTokenMeta ? csrfTokenMeta.getAttribute('content') : null;
    const csrfHeader = csrfHeaderMeta ? csrfHeaderMeta.getAttribute('content') : 'X-CSRF-TOKEN';

    function buildHeaders() {
        const headers = {
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest'
        };
        if (csrfToken && csrfHeader) {
            headers[csrfHeader] = csrfToken;
        }
        return headers;
    }

    // capture initial serialized form state
    const form = document.querySelector('form[th\\:action], form');
    let initialSerialized = new URLSearchParams(new FormData(form)).toString();

    function isFormDirty() {
        return new URLSearchParams(new FormData(form)).toString() !== initialSerialized;
    }

    // helper to show a consistent message (Bulgarian)
    function requireSaveBeforeChange() {
        alert('Моля запазете първо детайлите на конфигурацията преди да промените елементите.');
    }

    // patched addUnit: check form dirty before sending
    function addUnit() {
        if (isFormDirty()) {
            requireSaveBeforeChange();
            return;
        }

        const cuId = document.getElementById('add-unit-select').value;
        const qty = parseInt(document.getElementById('add-qty').value || '1', 10);
        fetch('/configurations/' + configurationId + '/units/add', {
            method: 'POST',
            headers: buildHeaders(),
            body: JSON.stringify({configurableUnitId: cuId, quantity: qty})
        }).then(r => {
            if (!r.ok) throw new Error('Server error');
            return r.json();
        }).then(json => {
            location.reload();
        }).catch(e => {
            console.error('addUnit error', e);
            alert('Error adding unit: ' + (e.message || 'unknown'));
        });
    }

    // patched removeUnit: check form dirty before sending
    function removeUnit(btn) {
        if (isFormDirty()) {
            requireSaveBeforeChange();
            return;
        }

        const cuId = btn.getAttribute('data-id');
        fetch('/configurations/' + configurationId + '/units/remove', {
            method: 'POST',
            headers: buildHeaders(),
            body: JSON.stringify({configurableUnitId: cuId, quantity: 1})
        }).then(r => {
            if (!r.ok) throw new Error('Server error');
            return r.json();
        }).then(json => {
            location.reload();
        }).catch(e => {
            console.error('removeUnit error', e);
            alert('Error removing unit: ' + (e.message || 'unknown'));
        });
    }

    // optional: if user submits the details form successfully in-page (e.g. AJAX),
    // update initialSerialized so edits are allowed without reload.
    // If using normal POST submit (page reload), this is not necessary.
    form.addEventListener('submit', () => {
        // update snapshot so subsequent JS actions don't block (only useful for AJAX saves)
        initialSerialized = new URLSearchParams(new FormData(form)).toString();
    });
    /*]]>*/
</script>
</body>
</html>
