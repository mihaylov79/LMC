<!-- html -->
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="bg">
<head>
    <meta charset="UTF-8"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Edit Configuration</title>
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/edit-configuration.css?v=1.0">
</head>
<body>
<div class="header-container">
    <th:block th:insert="~{fragments/nav :: nav}"></th:block>
</div>

<h1 class="page-title"
    th:text="|Редактиране на ${configuration.model} ${configuration.description}|">Редактиране на конфигурация</h1>

<form id="details-form" th:action="@{|/configurations/edit/${configurationId}|}" th:object="${configuration}"
      th:attr="data-id=${configurationId}" method="post" onsubmit="prepareOptionSelections();">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <!-- Hidden bind inputs so full "Запази" submit works without visible th:field duplicates -->
    <input type="hidden" th:field="*{imgUrl}" id="hidden-imgUrl"/>
    <input type="hidden" th:field="*{code}" id="hidden-code"/>
    <input type="hidden" th:field="*{line}" id="hidden-line"/>
    <input type="hidden" th:field="*{type}" id="hidden-type"/>
    <input type="hidden" th:field="*{description}" id="hidden-description"/>
    <input type="hidden" th:field="*{model}" id="hidden-model"/>

    <!-- Section title for Details -->
    <h2 class="section-title">Детайли:</h2>

    <div class="details-grid">
        <!-- existing detail fields (no change) -->
        <!-- keep original detail inputs if needed (omitted here for brevity) -->
    </div> <!-- /.details-grid -->

    <!-- Units section title -->
    <h3 class="section-title section-spaced">Елементи на конфигурацията:</h3>

    <!-- Hidden template for units select options -->
    <select id="unitOptionsTemplate" style="display:none">
        <option value="">Изберете unit</option>
        <option th:each="u : ${existingUnits}"
                th:value="${u.id}"
                th:text="${u.unit.code + ' - ' + u.unit.name }">
        </option>
    </select>

    <!-- Server-side map of unitId -> options (used by JS) -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const unitOptionsMap = {};
        /*[[# th:each="cu,cuStat : ${existingUnits}" ]]*/
        unitOptionsMap['/*[[${cu.id}]]*/'] = [
            /*[[# th:each="co,coStat : ${cu.options}" ]]*/
            {
                optionId: '/*[[${co.option.id}]]*/',
                code: '/*[[${co.option.code}]]*/',
                name: '/*[[${co.option.name}]]*/',
                price: '/*[[${co.option.price}]]*/'
            }/*[[${coStat.last} ? '' : ',' ]]*/
            /*[[/]]*/
        ];
        /*[[/]]*/

        // initialUnitSelections: always emit a valid JS literal (array) using a single inline expression
        const initialUnitSelections = {};
        /*[[# th:each="u, stat : ${configuration.units}" ]]*/
        initialUnitSelections['/*[[${stat.index}]]*/'] = /*[[${u.optionSelections} != null ? u.optionSelections : T(java.util.Collections).emptyList()}]]*/;
        /*[[/]]*/
        /*]]>*/
    </script>

    <!-- Units container: this form uses the same structure as new-configuration to allow editing -->
    <div id="units-container">
        <div th:each="unit, stat : *{units}" class="unit-row">
            <select th:field="*{units[__${stat.index}__].configurableUnitId}" class="unit-select" required>
                <option value="">Изберете unit</option>
                <option th:each="u : ${existingUnits}"
                        th:value="${u.id}"
                        th:text="${u.unit.code + ' - ' + u.unit.name}">
                </option>
            </select>

            <input type="number"
                   th:field="*{units[__${stat.index}__].quantity}"
                   min="1"
                   th:value="${unit.quantity}"
                   required
                   placeholder="Бр."/>

            <!-- options panel for this row (will be filled by JS) -->
            <div class="inline-options" style="margin-left:1rem;">
                <div class="options-for-row"></div>
            </div>

            <button type="button" class="remove-btn" onclick="removeUnitRow(this)">Премахни</button>
        </div>
    </div>

    <div style="margin-top:1rem;">
        <button type="button" onclick="addUnit()">Добави Unit</button>
        <button type="submit">Запази</button>
        <a th:href="@{|/configurations/${configurationId}/details|}">
            <button type="button" class="finish-btn">Край</button>
        </a>
    </div>
</form>

<script th:inline="javascript">
    /*<![CDATA[*/
    const configurationId = (/*[[${configurationId}]]*/ '') || document.querySelector('form#details-form').dataset.id;
    const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
    const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
    const csrfToken = csrfTokenMeta ? csrfTokenMeta.getAttribute('content') : null;
    const csrfHeader = csrfHeaderMeta ? csrfHeaderMeta.getAttribute('content') : 'X-CSRF-TOKEN';

    function buildHeaders(contentType='application/json') {
        const headers = {
            'Content-Type': contentType,
            'X-Requested-With': 'XMLHttpRequest'
        };
        if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
        return headers;
    }

    const unitTemplate = document.getElementById('unitOptionsTemplate');
    const unitsContainer = document.getElementById('units-container');

    function addUnit() {
        const div = document.createElement('div');
        div.className = 'unit-row';

        // select
        const select = document.createElement('select');
        select.className = 'unit-select';
        select.required = true;
        select.innerHTML = unitTemplate.innerHTML;

        // qty
        const qty = document.createElement('input');
        qty.type = 'number';
        qty.min = '1';
        qty.value = '1';
        qty.required = true;
        qty.placeholder = 'Бр.';

        // options container (rendered but without names)
        const optionsWrapper = document.createElement('div');
        optionsWrapper.className = 'inline-options';
        const optionsInner = document.createElement('div');
        optionsInner.className = 'options-for-row';
        optionsWrapper.appendChild(optionsInner);

        // remove button
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'remove-btn';
        btn.textContent = 'Премахни';
        btn.addEventListener('click', () => { div.remove(); reindexUnits(); });

        // assemble
        div.appendChild(select);
        div.appendChild(qty);
        div.appendChild(optionsWrapper);
        div.appendChild(btn);

        // when unit selected render options
        select.addEventListener('change', () => renderOptionsForRow(div, select.value));

        unitsContainer.appendChild(div);
        reindexUnits();
    }

    function removeUnitRow(btn) {
        const row = btn.closest('.unit-row');
        if (row) { row.remove(); reindexUnits(); }
    }

    function renderOptionsForRow(rowElement, unitId) {
        const container = rowElement.querySelector('.options-for-row');
        container.innerHTML = '';
        if (!unitId || !unitOptionsMap[unitId] || unitOptionsMap[unitId].length === 0) {
            return;
        }
        unitOptionsMap[unitId].forEach(opt => {
            const row = document.createElement('div');
            row.style.display = 'flex';
            row.style.alignItems = 'center';
            row.style.gap = '0.4rem';
            row.style.marginBottom = '0.25rem';

            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'opt-cb';
            cb.dataset.optionId = opt.optionId;

            const label = document.createElement('label');
            label.textContent = (opt.code ? opt.code + ' - ' : '') + (opt.name || '') + (opt.price ? ' (' + opt.price + ' EUR)' : '');

            const qty = document.createElement('input');
            qty.type = 'number';
            qty.min = '1';
            qty.value = '1';
            qty.className = 'opt-qty';
            qty.style.width = '70px';
            qty.disabled = true;

            // set data-option-id on qty so prefill code can find it
            qty.dataset.optionId = opt.optionId;

            cb.addEventListener('change', () => { qty.disabled = !cb.checked; });

            row.appendChild(cb);
            row.appendChild(label);
            row.appendChild(qty);
            container.appendChild(row);
        });
    }

    // helper used in other templates: render options for the add-unit panel
    function renderOptionsForUnit(unitId) {
        // reuse logic used for add-controls panel (not complicated here)
        // find global options-list if present
        const optionsList = document.getElementById('options-list');
        if (!optionsList) return;
        optionsList.innerHTML = '';
        if (!unitId || !unitOptionsMap[unitId] || unitOptionsMap[unitId].length === 0) {
            document.getElementById('options-panel').style.display = 'none';
            return;
        }
        document.getElementById('options-panel').style.display = 'block';
        unitOptionsMap[unitId].forEach(opt => {
            const row = document.createElement('div');
            row.className = 'option-row';
            row.style.display = 'flex';
            row.style.alignItems = 'center';
            row.style.gap = '0.5rem';
            row.style.marginBottom = '0.4rem';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'option-checkbox';
            checkbox.dataset.optionId = opt.optionId;

            const label = document.createElement('label');
            label.textContent = (opt.code ? opt.code + ' - ' : '') + (opt.name || '') + (opt.price ? ' (' + opt.price + ' EUR)' : '');

            const qty = document.createElement('input');
            qty.type = 'number';
            qty.min = '1';
            qty.value = '1';
            qty.className = 'option-qty';
            qty.style.width = '70px';
            qty.style.marginLeft = 'auto';
            qty.dataset.optionId = opt.optionId;

            row.appendChild(checkbox);
            row.appendChild(label);
            row.appendChild(qty);
            optionsList.appendChild(row);

            checkbox.addEventListener('change', () => { qty.disabled = !checkbox.checked; });
            qty.disabled = true;
        });
    }

    function reindexUnits() {
        const rows = Array.from(document.querySelectorAll('#units-container .unit-row'));
        rows.forEach((row, i) => {
            const select = row.querySelector('.unit-select');
            const qty = row.querySelector('input[type="number"]:not(.opt-qty)');

            if (select) select.name = `units[${i}].configurableUnitId`;
            if (qty) qty.name = `units[${i}].quantity`;

            // remove any existing hidden optionSelection inputs (they will be rebuilt on submit)
            Array.from(row.querySelectorAll('input[type="hidden"].option-selection')).forEach(h => h.remove());
        });
    }

    // Before submit, build hidden inputs for selected options per unit
    function prepareOptionSelections() {
        reindexUnits();
        const rows = Array.from(document.querySelectorAll('#units-container .unit-row'));
        rows.forEach((row, i) => {
            // clean previous hidden inputs
            Array.from(row.querySelectorAll('input[type="hidden"].option-selection')).forEach(h => h.remove());

            const checkedRows = Array.from(row.querySelectorAll('.options-for-row div')).filter(r => {
                const cb = r.querySelector('.opt-cb');
                return cb && cb.checked;
            });

            checkedRows.forEach((r, j) => {
                const cb = r.querySelector('.opt-cb');
                const q = r.querySelector('.opt-qty');
                const optionId = cb.dataset.optionId;
                const quantity = Math.max(1, parseInt(q.value || '1', 10));

                // create hidden inputs names: units[i].optionSelections[j].optionId and ...quantity
                const hidOption = document.createElement('input');
                hidOption.type = 'hidden';
                hidOption.className = 'option-selection';
                hidOption.name = `units[${i}].optionSelections[${j}].optionId`;
                hidOption.value = optionId;

                const hidQty = document.createElement('input');
                hidQty.type = 'hidden';
                hidQty.className = 'option-selection';
                hidQty.name = `units[${i}].optionSelections[${j}].quantity`;
                hidQty.value = quantity;

                row.appendChild(hidOption);
                row.appendChild(hidQty);
            });
        });
    }

    // init: attach change listeners for any server-rendered rows and prefill saved selections
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('#units-container .unit-row').forEach((row, index) => {
            const select = row.querySelector('.unit-select');
            if (select) {
                // render options for pre-selected unit
                renderOptionsForRow(row, select.value);

                // prefill selections from server-model (if present)
                const sel = initialUnitSelections && initialUnitSelections[index];
                if (Array.isArray(sel)) {
                    sel.forEach(s => {
                        try {
                            const cb = row.querySelector(`.options-for-row .opt-cb[data-option-id="${s.optionId}"]`);
                            const q = row.querySelector(`.options-for-row .opt-qty[data-option-id="${s.optionId}"]`);
                            if (cb) {
                                cb.checked = true;
                                if (q) { q.value = Math.max(1, Number(s.quantity) || 1); q.disabled = false; }
                            }
                        } catch (e) { /* ignore invalid/missing entries */ }
                    });
                }

                // attach change listener for later selection changes
                select.addEventListener('change', () => renderOptionsForRow(row, select.value));
            }
        });
        reindexUnits();

        // if an add-unit panel exists, render its options (compat)
        const initialAddSel = document.getElementById('add-unit-select');
        if (initialAddSel && initialAddSel.value) {
            renderOptionsForUnit(initialAddSel.value);
        }
    });
    /*]]>*/
</script>

</body>
</html>
