<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<!DOCTYPE html>
<head>
    <meta charset="UTF-8"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Редакция на конфигурация</title>
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/edit-configuration.css?v=1.0">
    <link rel="stylesheet" href="/css/user-details.css">
</head>
<body>
<div class="header-container">
    <th:block th:insert="~{fragments/nav :: nav}"></th:block>
</div>
<div class="front-container">
    <th:block th:insert="~{fragments/user-info :: userInfo}"></th:block>
</div>

<h1 class="page-title" th:text="|Редактиране на ${configuration.model} ${configuration.description}|">Редактиране на конфигурация</h1>

<form id="details-form"
      th:action="@{|/configurations/edit/${configurationId}|}"
      th:object="${configuration}"
      th:attr="data-id=${configurationId}"
      method="post"
      onsubmit="prepareOptionSelections();">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <!-- keep hidden binding inputs for full-submit compatibility (hidden by CSS) -->
    <input type="hidden" th:field="*{imgUrl}" id="hidden-imgUrl"/>
    <input type="hidden" th:field="*{code}" id="hidden-code"/>
    <input type="hidden" th:field="*{line}" id="hidden-line"/>
    <input type="hidden" th:field="*{type}" id="hidden-type"/>
    <input type="hidden" th:field="*{description}" id="hidden-description"/>
    <input type="hidden" th:field="*{model}" id="hidden-model"/>

    <h2 class="section-title">Детайли:</h2>
    <div class="details-grid">
        <!-- Code -->
        <div class="detail-field">
            <label>Код</label>
            <div class="detail-row">
                <span class="detail-value" id="code-value" th:text="*{code}">--</span>
                <button type="button" class="edit-field-btn" onclick="toggleInline('code')">Редактирай</button>
            </div>
            <div class="inline-field-form" id="inline-code">
                <input id="inline-code-input" class="inline-input" type="text" />
                <button type="button" class="change-btn" onclick="submitField('code')">Промени</button>
            </div>
        </div>

        <!-- Model -->
        <div class="detail-field">
            <label>Модел</label>
            <div class="detail-row">
                <span class="detail-value" id="model-value" th:text="*{model}">--</span>
                <button type="button" class="edit-field-btn" onclick="toggleInline('model')">Редактирай</button>
            </div>
            <div class="inline-field-form" id="inline-model">
                <input id="inline-model-input" class="inline-input" type="text" />
                <button type="button" class="change-btn" onclick="submitField('model')">Промени</button>
            </div>
        </div>

        <!-- Line -->
        <div class="detail-field">
            <label>Линия</label>
            <div class="detail-row">
                <span class="detail-value" id="line-value" th:text="*{line}">--</span>
                <button type="button" class="edit-field-btn" onclick="toggleInline('line')">Редактирай</button>
            </div>
            <div class="inline-field-form" id="inline-line">
                <select id="inline-line-select" class="inline-select">
                    <option value="">(избери)</option>
                    <option th:each="ln : ${T(lmc.configuration.model.MachineLine).values()}"
                            th:value="${ln}" th:text="${ln}"></option>
                </select>
                <button type="button" class="change-btn" onclick="submitField('line')">Промени</button>
            </div>
        </div>

        <!-- Description -->
        <div class="detail-field">
            <label>Описание</label>
            <div class="detail-row">
                <span class="detail-value" id="description-value" th:text="*{description}">--</span>
                <button type="button" class="edit-field-btn" onclick="toggleInline('description')">Редактирай</button>
            </div>
            <div class="inline-field-form" id="inline-description">
                <textarea id="inline-description-input" class="inline-textarea"></textarea>
                <button type="button" class="change-btn" onclick="submitField('description')">Промени</button>
            </div>
        </div>
    </div>

    <h3 class="section-title section-spaced">Елементи на конфигурацията:</h3>

    <select id="unitOptionsTemplate" style="display:none">
        <option value="">Изберете unit</option>
        <option th:each="u : ${existingUnits}" th:value="${u.id}" th:text="${u.code + ' - ' + u.unit.name }"></option>
    </select>

    <div id="server-data" style="display:none">
        <!-- ВСИЧКИ ConfigurableUnits (SimpleUnit + ConfiguredUnit) с техните опции -->
        <div th:each="u : ${existingUnits}" th:attr="data-unit-id=${u.id},data-base-price=${unitPrices[u.id]}">
            <!-- Ако unit-ът е ConfiguredUnit, показваме опциите -->
            <th:block th:if="${#strings.contains(u.getClass().getName(), 'ConfiguredUnit')}">
                <div th:each="co : ${u.options}"
                     class="unit-option"
                     th:attr="data-option-id=${co.option.id},data-code=${co.option.code},data-name=${co.option.name},data-price=${co.option.price}">
                </div>
            </th:block>
        </div>

        <div th:if="${configuration != null and configuration.units != null}">
            <div th:each="unit, idx : *{units}" th:attr="data-unit-idx=${idx.index}">
                <div th:each="sel : ${unit.optionSelections}"
                     class="sel"
                     th:attr="data-option-id=${sel.optionId},data-qty=${sel.quantity}">
                </div>
            </div>
        </div>
    </div>

    <script>
        var unitOptionsMap = {}; var initialUnitSelections = {};
        (function buildMaps(){
            document.querySelectorAll('#server-data > div[data-unit-id]').forEach(u=>{
                const id = String(u.getAttribute('data-unit-id'));
                const basePriceAttr = u.getAttribute('data-base-price');
                const basePrice = (basePriceAttr === null || basePriceAttr === 'null' || basePriceAttr === '') ? null : Number(basePriceAttr);
                const options = Array.from(u.querySelectorAll('.unit-option')).map(o=>{
                    const priceAttr = o.getAttribute('data-price');
                    const price = (priceAttr === null || priceAttr === 'null' || priceAttr === '') ? null : Number(priceAttr);
                    return { optionId: String(o.getAttribute('data-option-id')), code: o.getAttribute('data-code'), name: o.getAttribute('data-name'), price: price };
                });
                // дори units без опции трябва да имат basePrice
                unitOptionsMap[id] = { basePrice: basePrice, options: options };
            });
            document.querySelectorAll('#server-data div[data-unit-idx]').forEach(u=>{
                const idx = u.getAttribute('data-unit-idx');
                const sels = Array.from(u.querySelectorAll('.sel')).map(s=>({ optionId: String(s.getAttribute('data-option-id')), quantity: Math.max(1, parseInt(s.getAttribute('data-qty')||'1',10)) }));
                initialUnitSelections[idx] = sels;
            });
        })();
    </script>

    <div id="units-container">
        <div th:each="unit, stat : *{units}" class="unit-row" data-persisted="true">
            <select th:field="*{units[__${stat.index}__].configurableUnitId}" class="unit-select" required>
                <option value="">Изберете unit</option>
                <option th:each="u : ${existingUnits}" th:value="${u.id}" th:text="${u.code + ' - ' + u.unit.name }"></option>
            </select>

            <input type="number"
                   th:field="*{units[__${stat.index}__].quantity}"
                   min="1"
                   th:value="${unit.quantity}"
                   required
                   placeholder="Бр."/>

            <button type="button" class="remove-btn" onclick="removeUnitRow(this)">Премахни</button>

            <div class="inline-options">
                <div class="options-for-row"></div>
            </div>

            <span class="unit-price-display">—</span>
        </div>
    </div>

    <div style="margin-top:1rem;">
        <button type="button" onclick="addUnit()">Добави Unit</button>
        <button type="button" onclick="openCreateUnitModal()">Създай нов Unit</button>
        <a th:href="@{|/configurations/${configurationId}/details|}">
            <button type="button" class="finish-btn">Край</button>
        </a>
    </div>
</form>

<!-- Create Unit Modal -->
<div id="createUnitModal" style="display:none;">
    <div class="modal-content create-modal-content">
        <h3>Създай нов Configurable Unit</h3>
        <form id="createUnitForm" onsubmit="return false;">
            <input type="hidden" id="csrfToken" th:value="${_csrf.token}"/>
            <div>
                <label>Базов продукт:</label>
                <select id="newUnitBase" required>
                    <option value="">-- Изберете --</option>
                    <option th:each="unit : ${allUnits}" th:value="${unit.id}" th:text="${unit.code + ' - ' + unit.name}"></option>
                </select>
            </div>
            <div>
                <label>Опции (незадължително):</label>
                <div id="newUnitOptions">
                    <div th:each="option : ${allOptions}">
                        <input type="checkbox" th:id="'newOpt_' + ${option.id}" th:value="${option.id}" class="modal-opt"/>
                        <label th:for="'newOpt_' + ${option.id}" th:text="${option.code + ' - ' + option.name}"></label>
                        <input type="number" min="1" value="1" class="modal-opt-qty" style="width:60px"/>
                    </div>
                </div>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-create" onclick="submitNewUnit()">Създай</button>
                <button type="button" class="btn-cancel" onclick="closeCreateUnitModal()">Откажи</button>
            </div>
        </form>
    </div>
</div>

<script>
    // CSRF helpers
    const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
    const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
    const csrfToken = csrfTokenMeta ? csrfTokenMeta.getAttribute('content') : null;
    const csrfHeader = csrfHeaderMeta ? csrfHeaderMeta.getAttribute('content') : 'X-CSRF-TOKEN';

    function buildHeaders(contentType='application/json') {
        const headers = { 'Content-Type': contentType, 'X-Requested-With': 'XMLHttpRequest' };
        if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
        return headers;
    }

    const cfgForm = document.getElementById('details-form');
    const configurationId = window.configurationId || (cfgForm ? cfgForm.getAttribute('data-id') : null);

    // Inline edit helpers
    function toggleInline(field) {
        const wrapper = document.getElementById('inline-' + field);
        if (!wrapper) return;
        const isOpen = wrapper.classList.contains('open');
        document.querySelectorAll('.inline-field-form.open').forEach(el => el.classList.remove('open'));
        if (!isOpen) {
            const hidden = document.getElementById('hidden-' + field);
            if (field === 'line') {
                const sel = document.getElementById('inline-line-select');
                if (sel && hidden) { sel.value = hidden.value || ''; }
            } else {
                const input = document.getElementById('inline-' + field + (field === 'description' ? '-input' : '-input'));
                if (input && hidden) input.value = hidden.value || '';
            }
            wrapper.classList.add('open');
        } else {
            wrapper.classList.remove('open');
        }
    }

    function submitField(field) {
        const hidden = document.getElementById('hidden-' + field);
        if (!hidden) return;
        let value = '';
        if (field === 'line') {
            const sel = document.getElementById('inline-line-select');
            if (sel) value = sel.value;
        } else if (field === 'description') {
            const ta = document.getElementById('inline-description-input');
            if (ta) value = ta.value;
        } else {
            const inp = document.getElementById('inline-' + field + '-input');
            if (inp) value = inp.value;
        }
        hidden.value = value;
        const span = document.getElementById(field + '-value');
        if (span) span.textContent = value || '';
        cfgForm.submit();
    }

    // Units JS
    const unitTemplate = document.getElementById('unitOptionsTemplate');
    const unitsContainer = document.getElementById('units-container');

    // Изчислява и показва цената на един unit ред
    function updateUnitPrice(rowElement) {
        const priceDisplay = rowElement.querySelector('.unit-price-display');
        if (!priceDisplay) return;

        const select = rowElement.querySelector('.unit-select');
        const qtyInput = rowElement.querySelector('input[type="number"]:not(.opt-qty)');

        if (!select || !select.value) {
            priceDisplay.textContent = '—';
            return;
        }

        const unitId = select.value;
        const unitData = unitOptionsMap[unitId];
        const quantity = qtyInput ? Math.max(1, parseInt(qtyInput.value || '1', 10)) : 1;

        if (!unitData) {
            priceDisplay.textContent = '—';
            return;
        }

        // basePrice от unitOptionsMap (изчислена цена с template опции × 1)
        let unitPrice = unitData.basePrice || 0;

        const isPersisted = rowElement.dataset.persisted === 'true';

        if (isPersisted) {
            // За PERSISTED rows: basePrice включва template опции × 1
            // Checkbox-овете са disabled, трябва да четем от initialUnitSelections

            // Намираме индекса на реда
            const allRows = Array.from(document.querySelectorAll('#units-container .unit-row'));
            const rowIndex = allRows.indexOf(rowElement);

            if (rowIndex >= 0 && initialUnitSelections[rowIndex]) {
                // Имаме запазени selections за този ред
                const selections = initialUnitSelections[rowIndex];

                // Извадаме template опциите × 1 от basePrice
                let baseWithoutOptions = unitData.basePrice || 0;
                if (unitData.options && unitData.options.length > 0) {
                    unitData.options.forEach(opt => {
                        if (opt.price != null) {
                            baseWithoutOptions -= opt.price;
                        }
                    });
                }

                // Започваме от clean base
                unitPrice = baseWithoutOptions;

                // Добавяме опциите с реалните quantities от initialUnitSelections
                selections.forEach(sel => {
                    const option = unitData.options.find(o => o.optionId === sel.optionId);
                    if (option && option.price != null) {
                        unitPrice += (option.price * sel.quantity);
                    }
                });
            } else {
                // Няма initialUnitSelections - използваме basePrice както е
                // (включва template опции × 1)
            }
        } else {
            // За НОВИ rows: basePrice включва template опции × 1, добавяме избраните опции
            const checkedOptions = Array.from(rowElement.querySelectorAll('.options-for-row .opt-cb')).filter(cb => cb.checked);

            // Извадаме template опциите × 1 (ако има)
            let baseWithoutOptions = unitData.basePrice || 0;
            if (unitData.options && unitData.options.length > 0) {
                unitData.options.forEach(opt => {
                    if (opt.price != null) {
                        baseWithoutOptions -= opt.price;
                    }
                });
            }

            // Започваме от clean base
            unitPrice = baseWithoutOptions;

            // Добавяме САМО избраните опции
            checkedOptions.forEach(cb => {
                const optionId = cb.dataset.optionId;
                const option = unitData.options.find(o => o.optionId === optionId);
                if (option && option.price != null) {
                    const optQtyInput = rowElement.querySelector(`.opt-qty[data-option-id="${optionId}"]`);
                    const optQty = optQtyInput ? Math.max(1, parseInt(optQtyInput.value || '1', 10)) : 1;
                    unitPrice += (option.price * optQty);
                }
            });
        }

        // Умножи по quantity на unit-а
        const totalPrice = unitPrice * quantity;
        priceDisplay.textContent = totalPrice.toFixed(2) + ' EUR';
    }

    function addUnit() {
        const div = document.createElement('div');
        div.className = 'unit-row';

        const select = document.createElement('select');
        select.className = 'unit-select';
        select.required = true;
        select.innerHTML = unitTemplate ? unitTemplate.innerHTML : '<option value="">Изберете unit</option>';

        const qty = document.createElement('input');
        qty.type = 'number';
        qty.min = '1';
        qty.value = '1';
        qty.required = true;
        qty.placeholder = 'Бр.';

        const optionsWrapper = document.createElement('div');
        optionsWrapper.className = 'inline-options';
        const optionsInner = document.createElement('div');
        optionsInner.className = 'options-for-row';
        optionsWrapper.appendChild(optionsInner);

        const priceDisplay = document.createElement('span');
        priceDisplay.className = 'unit-price-display';
        priceDisplay.textContent = '—';

        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'add-btn';
        addBtn.textContent = 'Добави';
        addBtn.addEventListener('click', () => persistRow(div));

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = 'Премахни';
        removeBtn.addEventListener('click', () => removeUnitRow(removeBtn));

        // Структура: select, qty, buttons (в един ред), после опции, после цена
        div.appendChild(select);
        div.appendChild(qty);
        div.appendChild(addBtn);
        div.appendChild(removeBtn);
        div.appendChild(optionsWrapper);
        div.appendChild(priceDisplay);

        select.addEventListener('change', () => {
            renderOptionsForRow(div, select.value);
            updateUnitPrice(div);
        });
        qty.addEventListener('input', () => updateUnitPrice(div));

        unitsContainer.appendChild(div);
        reindexUnits();
        select.focus();
    }

    async function removeUnitRow(btn) {
        const row = btn.closest('.unit-row');
        if (!row) return;

        if (!row.dataset.persisted || row.dataset.persisted !== 'true') {
            row.remove(); reindexUnits(); return;
        }

        try {
            const select = row.querySelector('.unit-select');
            const qtyInput = row.querySelector('input[type="number"]:not(.opt-qty)');
            const configurableUnitId = select ? select.value : null;
            const currentQty = qtyInput ? Math.max(1, parseInt(qtyInput.value || '1', 10)) : 1;
            const qty = 1; // винаги премахваме 1 брой
            const optionSelections = collectOptionSelections(row);

            const res = await ajaxRemoveUnit(configurationId, configurableUnitId, qty, optionSelections);

            // Ако има още броеве, обновяваме quantity вместо да премахваме реда
            const newQty = currentQty - qty;
            if (newQty > 0) {
                if (qtyInput) {
                    qtyInput.value = newQty;
                    // Обновяваме цената
                    updateUnitPrice(row);
                }
            } else {
                // Няма повече броеве - премахваме реда
                row.remove();
                reindexUnits();
            }

            if (res && res.totalPrice !== undefined) {
                const totalEl = document.getElementById('total-price');
                if (totalEl) totalEl.textContent = res.totalPrice;
                const dateEl = document.getElementById('price-update-date');
                if (dateEl && res.priceUpdateDate) dateEl.textContent = res.priceUpdateDate;
            }
        } catch (err) {
            console.error(err);
            alert('Грешка при премахване: ' + (err.message || 'network'));
        }
    }


    // File: src/main/resources/templates/edit-configuration.html
    // JavaScript - replace the existing renderOptionsForRow and the DOMContentLoaded block's initial-selection part

    function renderOptionsForRow(rowElement, unitId) {
        const container = rowElement.querySelector('.options-for-row'); if (!container) return;
        container.innerHTML = '';
        if (!unitId || !unitOptionsMap[unitId] || !unitOptionsMap[unitId].options || unitOptionsMap[unitId].options.length === 0) {
            updateUnitPrice(rowElement);
            return;
        }

        // treat persisted rows as read-only
        const isPersisted = rowElement.dataset.persisted === 'true';

        unitOptionsMap[unitId].options.forEach(opt => {
            const row = document.createElement('div');
            row.style.display = 'flex';
            row.style.alignItems = 'center';
            row.style.gap = '0.4rem';
            row.style.marginBottom = '0.25rem';

            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'opt-cb';
            cb.dataset.optionId = String(opt.optionId);

            const label = document.createElement('label');
            label.textContent = (opt.code ? opt.code + ' - ' : '') + (opt.name || '') + (opt.price != null ? ' (' + opt.price + ' EUR)' : '');

            const qty = document.createElement('input');
            qty.type = 'number';
            qty.min = '1';
            qty.value = '1';
            qty.className = 'opt-qty';
            qty.style.width = '70px';
            qty.dataset.optionId = String(opt.optionId);

            if (!isPersisted) {
                // За нови редове: template опциите са pre-checked и quantity е enabled
                cb.checked = true;  // ✅ Pre-check всички template опции
                qty.disabled = false;  // ✅ Quantity е винаги enabled за редактиране

                cb.addEventListener('change', () => {
                    qty.disabled = !cb.checked;
                    updateUnitPrice(rowElement);
                });
                qty.addEventListener('input', () => updateUnitPrice(rowElement));
            } else {
                // persisted: keep inputs disabled (read-only)
                cb.disabled = true;
                qty.disabled = true;
            }

            row.appendChild(cb);
            row.appendChild(label);
            row.appendChild(qty);
            container.appendChild(row);
        });

        updateUnitPrice(rowElement);
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('#units-container .unit-row').forEach((row, index) => {
            // mark server-provided rows as persisted
            row.dataset.persisted = 'true';
            const select = row.querySelector('.unit-select');
            const qtyInput = row.querySelector('input[type="number"]:not(.opt-qty)');

            if (select) {
                renderOptionsForRow(row, select.value);

                // prefill selections from initialUnitSelections but keep them read-only
                const sel = initialUnitSelections && initialUnitSelections[index];
                if (Array.isArray(sel)) sel.forEach(s => {
                    try {
                        const cb = row.querySelector(`.options-for-row .opt-cb[data-option-id="${s.optionId}"]`);
                        const q = row.querySelector(`.options-for-row .opt-qty[data-option-id="${s.optionId}"]`);
                        if (cb) { cb.checked = true; cb.disabled = true; }
                        if (q) { q.value = Math.max(1, Number(s.quantity) || 1); q.disabled = true; }
                    } catch (e) {}
                });

                select.addEventListener('change', () => {
                    renderOptionsForRow(row, select.value);
                    updateUnitPrice(row);
                });
            }

            if (qtyInput) {
                qtyInput.addEventListener('input', () => updateUnitPrice(row));
            }

            // изчисли началната цена
            updateUnitPrice(row);
        });
        reindexUnits();
    });


    function reindexUnits() {
        const rows = Array.from(document.querySelectorAll('#units-container .unit-row'));
        rows.forEach((row, i) => {
            const select = row.querySelector('.unit-select');
            const qty = row.querySelector('input[type="number"]:not(.opt-qty)');
            if (select) select.name = `units[${i}].configurableUnitId`;
            if (qty) qty.name = `units[${i}].quantity`;
            Array.from(row.querySelectorAll('input[type="hidden"].option-selection')).forEach(h => h.remove());
        });
    }

    function prepareOptionSelections() {
        reindexUnits();
        const rows = Array.from(document.querySelectorAll('#units-container .unit-row'));
        rows.forEach((row, i) => {
            Array.from(row.querySelectorAll('input[type="hidden"].option-selection')).forEach(h => h.remove());
            const checkedRows = Array.from(row.querySelectorAll('.options-for-row div')).filter(r => {
                const cb = r.querySelector('.opt-cb'); return cb && cb.checked;
            });
            checkedRows.forEach((r, j) => {
                const cb = r.querySelector('.opt-cb'); const q = r.querySelector('.opt-qty');
                const optionId = cb.dataset.optionId; const quantity = Math.max(1, parseInt(q.value || '1', 10));
                const hidOption = document.createElement('input'); hidOption.type = 'hidden'; hidOption.className = 'option-selection';
                hidOption.name = `units[${i}].optionSelections[${j}].optionId`; hidOption.value = optionId;
                const hidQty = document.createElement('input'); hidQty.type = 'hidden'; hidQty.className = 'option-selection';
                hidQty.name = `units[${i}].optionSelections[${j}].quantity`; hidQty.value = quantity;
                row.appendChild(hidOption); row.appendChild(hidQty);
            });
        });
    }

    function collectOptionSelections(row) {
        const sels = [];
        row.querySelectorAll('.options-for-row .opt-cb').forEach(cb => {
            if (cb.checked) {
                const optionId = String(cb.dataset.optionId);
                const qtyEl = row.querySelector(`.opt-qty[data-option-id="${optionId}"]`);
                const quantity = Math.max(1, parseInt(qtyEl ? qtyEl.value : '1', 10));
                sels.push({ optionId: optionId, quantity: quantity });
            }
        });
        return sels.length ? sels : null;
    }

    async function ajaxAddUnit(configurationId, configurableUnitId, quantity, optionSelections) {
        const body = { configurableUnitId, quantity, optionSelections };
        const res = await fetch(`/configurations/${configurationId}/units/add`, {
            method: 'POST',
            headers: buildHeaders(),
            body: JSON.stringify(body)
        });
        if (!res.ok) {
            const txt = await res.text(); throw new Error(txt || 'Network error');
        }
        return await res.json();
    }

    async function ajaxRemoveUnit(configurationId, configurableUnitId, quantity, optionSelections) {
        const body = { configurableUnitId, quantity, optionSelections };
        const res = await fetch(`/configurations/${configurationId}/units/remove`, {
            method: 'POST',
            headers: buildHeaders(),
            body: JSON.stringify(body)
        });
        if (!res.ok) {
            const txt = await res.text(); throw new Error(txt || 'Network error');
        }
        return await res.json();
    }

    async function persistRow(row) {
        try {
            const select = row.querySelector('.unit-select');
            const qtyEl = row.querySelector('input[type="number"]:not(.opt-qty)');
            const configurableUnitId = select ? select.value : null;
            if (!configurableUnitId) { alert('Моля изберете Unit'); return; }
            const qty = qtyEl ? Math.max(1, parseInt(qtyEl.value || '1', 10)) : 1;
            const optionSelections = collectOptionSelections(row);

            const data = await ajaxAddUnit(configurationId, configurableUnitId, qty, optionSelections);

            // Проверяваме дали вече има съществуващ ред със същия unit и опции
            const existingRow = findExistingPersistedRow(configurableUnitId, optionSelections);

            if (existingRow && existingRow !== row) {
                // Има съществуващ ред - обединяваме quantity
                const existingQtyInput = existingRow.querySelector('input[type="number"]:not(.opt-qty)');
                if (existingQtyInput) {
                    const existingQty = Math.max(1, parseInt(existingQtyInput.value || '1', 10));
                    existingQtyInput.value = existingQty + qty;
                    // Преизчисляваме цената на съществуващия ред
                    updateUnitPrice(existingRow);
                }
                // Премахваме новия ред (дублиращ се)
                row.remove();
            } else {
                // Няма съществуващ ред - маркираме този като persisted
                row.dataset.persisted = 'true';
                row.querySelectorAll('input, select').forEach(el => { el.disabled = true; });
                const addBtn = row.querySelector('.add-btn'); if (addBtn) addBtn.remove();
            }

            reindexUnits();

            const totalEl = document.getElementById('total-price'); if (totalEl && data.totalPrice !== undefined) totalEl.textContent = data.totalPrice;
            const dateEl = document.getElementById('price-update-date'); if (dateEl && data.priceUpdateDate) dateEl.textContent = data.priceUpdateDate;
        } catch (err) {
            console.error(err); alert('Грешка при добавяне: ' + (err.message || 'network'));
        }
    }

    // Намира съществуващ persisted ред със същия unit и опции
    function findExistingPersistedRow(configurableUnitId, optionSelections) {
        const allRows = Array.from(document.querySelectorAll('#units-container .unit-row'));

        for (const row of allRows) {
            if (row.dataset.persisted !== 'true') continue; // Само persisted редове

            const rowSelect = row.querySelector('.unit-select');
            if (!rowSelect || rowSelect.value !== configurableUnitId) continue; // Различен unit

            // Сравняваме опциите
            const rowOptions = collectOptionSelections(row);
            if (optionsMatch(rowOptions, optionSelections)) {
                return row; // Намерен съществуващ ред
            }
        }

        return null; // Няма съществуващ ред
    }

    // Проверява дали две selections са идентични
    function optionsMatch(options1, options2) {
        // Ако и двете са null/undefined или празни
        if ((!options1 || options1.length === 0) && (!options2 || options2.length === 0)) return true;

        // Ако едното е празно, а другото не
        if (!options1 || !options2) return false;
        if (options1.length !== options2.length) return false;

        // Сравняваме опциите (sort за да не зависи от реда)
        const sorted1 = [...options1].sort((a, b) => a.optionId.localeCompare(b.optionId));
        const sorted2 = [...options2].sort((a, b) => a.optionId.localeCompare(b.optionId));

        for (let i = 0; i < sorted1.length; i++) {
            if (sorted1[i].optionId !== sorted2[i].optionId) return false;
            if (sorted1[i].quantity !== sorted2[i].quantity) return false;
        }

        return true;
    }

    // submitNewUnit: robust client-side refresh without controller change
    async function submitNewUnit() {
        const unitId = document.getElementById('newUnitBase').value;
        if (!unitId) { alert('Моля изберете базов продукт'); return; }

        const rows = Array.from(document.querySelectorAll('#newUnitOptions > div'));
        const selections = rows.map(row => {
            const cb = row.querySelector('input[type="checkbox"]');
            const qtyInput = row.querySelector('input[type="number"]');
            return cb && cb.checked ? { optionId: cb.value, quantity: Number(qtyInput.value) || 1, label: (row.querySelector('label') ? row.querySelector('label').textContent.trim() : '') } : null;
        }).filter(x => x !== null);

        try {
            const res = await fetch('/products/configurable-units/create-new', {
                method: 'POST',
                headers: buildHeaders(),
                body: JSON.stringify({ unitId: unitId, optionSelections: selections.length ? selections.map(s => ({ optionId: s.optionId, quantity: s.quantity })) : null })
            });

            if (!res.ok) {
                const txt = await res.text().catch(()=>null);
                throw new Error(txt || `Server returned ${res.status}`);
            }

            const contentType = res.headers.get('Content-Type') || '';
            if (!contentType.includes('application/json')) {
                window.location.reload();
                return;
            }

            const newUnit = await res.json();
            const newId = String(newUnit.id);

            // extract basePrice from newUnit response
            const basePrice = (newUnit.unit && newUnit.unit.price != null) ? Number(newUnit.unit.price) : null;

            // build opts from modal selections (no controller change needed)
            const opts = selections.map(s => {
                let code = null, name = null;
                if (s.label) {
                    const parts = s.label.split(' - ');
                    code = parts.length ? parts[0].trim() : null;
                    name = parts.length > 1 ? parts.slice(1).join(' - ').trim() : null;
                }
                return { optionId: String(s.optionId), code: code, name: name, price: null };
            });

            // update client map with basePrice
            unitOptionsMap[newId] = { basePrice: basePrice, options: opts };

            // update hidden template
            const label = (newUnit.unit && newUnit.unit.code ? newUnit.unit.code : '') + ' - ' + (newUnit.unit && newUnit.unit.name ? newUnit.unit.name : '');
            if (unitTemplate) {
                const optTemplateNode = document.createElement('option');
                optTemplateNode.value = newId;
                optTemplateNode.textContent = label;
                unitTemplate.appendChild(optTemplateNode);
            }

            // append fresh option nodes to every select (clone per-select)
            document.querySelectorAll('#units-container select').forEach(select => {
                const opt = document.createElement('option');
                opt.value = newId;
                opt.textContent = label;
                select.appendChild(opt);

                // if a select already has this value selected, render options immediately
                if (String(select.value) === newId) {
                    const row = select.closest('.unit-row');
                    if (row) renderOptionsForRow(row, newId);
                }
            });

            // add server-data stub for future rebuilds
            const serverData = document.getElementById('server-data');
            if (serverData) {
                const div = document.createElement('div');
                div.setAttribute('data-unit-id', newId);
                div.setAttribute('data-base-price', basePrice == null ? '' : String(basePrice));
                opts.forEach(o => {
                    const io = document.createElement('div');
                    io.className = 'unit-option';
                    io.setAttribute('data-option-id', String(o.optionId));
                    io.setAttribute('data-code', o.code || '');
                    io.setAttribute('data-name', o.name || '');
                    io.setAttribute('data-price', o.price == null ? '' : String(o.price));
                    div.appendChild(io);
                });
                serverData.appendChild(div);
            }

            closeCreateUnitModal();
            alert('Unit създаден успешно!');
        } catch (err) {
            console.error('submitNewUnit error:', err);
            alert('Грешка при създаване: ' + (err.message || 'network'));
        }
    }

    function openCreateUnitModal() {
        const modal = document.getElementById('createUnitModal');
        if (!modal) return;
        modal.style.display = 'block';
        const first = modal.querySelector('#newUnitBase');
        if (first) first.focus();
        function onEsc(e) { if (e.key === 'Escape') closeCreateUnitModal(); }
        modal._onEsc = onEsc;
        document.addEventListener('keydown', onEsc);
    }

    function closeCreateUnitModal() {
        const modal = document.getElementById('createUnitModal');
        if (!modal) return;
        modal.style.display = 'none';
        const form = document.getElementById('createUnitForm');
        if (form) form.reset();
        if (modal._onEsc) {
            document.removeEventListener('keydown', modal._onEsc);
            delete modal._onEsc;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('#units-container .unit-row').forEach((row, index) => {
            row.dataset.persisted = 'true';
            const select = row.querySelector('.unit-select');
            if (select) {
                renderOptionsForRow(row, select.value);
                const sel = initialUnitSelections && initialUnitSelections[index];
                if (Array.isArray(sel)) sel.forEach(s => {
                    try {
                        const cb = row.querySelector(`.options-for-row .opt-cb[data-option-id="${s.optionId}"]`);
                        const q = row.querySelector(`.options-for-row .opt-qty[data-option-id="${s.optionId}"]`);
                        if (cb) { cb.checked = true; if (q) { q.value = Math.max(1, Number(s.quantity) || 1); q.disabled = false; } }
                    } catch (e) {}
                });
                select.addEventListener('change', () => renderOptionsForRow(row, select.value));
            }
        });
        reindexUnits();
    });
</script>
