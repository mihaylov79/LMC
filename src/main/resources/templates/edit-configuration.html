<!-- html -->
<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Редакция на конфигурация</title>
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/edit-configuration.css?v=1.0">
</head>
<body>
<div class="header-container">
    <th:block th:insert="~{fragments/nav :: nav}"></th:block>
</div>

<h1 class="page-title" th:text="|Редактиране на ${configuration.model} ${configuration.description}|">Редактиране на конфигурация</h1>

<form id="details-form"
      th:action="@{|/configurations/edit/${configurationId}|}"
      th:object="${configuration}"
      th:attr="data-id=${configurationId}"
      method="post"
      onsubmit="prepareOptionSelections();">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <!-- keep hidden binding inputs for full-submit compatibility (hidden by CSS) -->
    <input type="hidden" th:field="*{imgUrl}" id="hidden-imgUrl"/>
    <input type="hidden" th:field="*{code}" id="hidden-code"/>
    <input type="hidden" th:field="*{line}" id="hidden-line"/>
    <input type="hidden" th:field="*{type}" id="hidden-type"/>
    <input type="hidden" th:field="*{description}" id="hidden-description"/>
    <input type="hidden" th:field="*{model}" id="hidden-model"/>

    <h2 class="section-title">Детайли:</h2>
    <div class="details-grid">

        <!-- imgUrl (text) -->
        <div class="detail-field">
            <label>URL на изображение:</label>
            <div class="detail-row">
                <span id="display-imgUrl" class="detail-value" th:text="*{imgUrl}">-</span>
                <div style="display:flex;gap:0.5rem;">
                    <button type="button" class="edit-field-btn" onclick="toggleInline('imgUrl')">Редактирай</button>
                </div>
            </div>

            <div id="inline-imgUrl" class="inline-field-form" style="display:none;">
                <input type="url" id="input-imgUrl" class="inline-input" th:value="*{imgUrl}" placeholder="URL на изображение"/>
                <button type="button" class="change-btn" onclick="submitField('imgUrl')">Промени</button>
                <button type="button" class="finish-btn" onclick="toggleInline('imgUrl')">Откажи</button>
                <div id="feedback-imgUrl" style="color:var(--danger); font-size:0.9rem; display:none;"></div>
            </div>
        </div>

        <!-- code (text) -->
        <div class="detail-field">
            <label>Код:</label>
            <div class="detail-row">
                <span id="display-code" class="detail-value" th:text="*{code}">-</span>
                <div style="display:flex;gap:0.5rem;">
                    <button type="button" class="edit-field-btn" onclick="toggleInline('code')">Редактирай</button>
                </div>
            </div>

            <div id="inline-code" class="inline-field-form" style="display:none;">
                <input type="text" id="input-code" class="inline-input" th:value="*{code}" placeholder="Код"/>
                <button type="button" class="change-btn" onclick="submitField('code')">Промени</button>
                <button type="button" class="finish-btn" onclick="toggleInline('code')">Откажи</button>
                <div id="feedback-code" style="color:var(--danger); font-size:0.9rem; display:none;"></div>
            </div>
        </div>

        <!-- line (enum select) -->
        <div class="detail-field">
            <label>Линия:</label>
            <div class="detail-row">
                <span id="display-line" class="detail-value" th:text="${configuration.line}">-</span>
                <div style="display:flex;gap:0.5rem;">
                    <button type="button" class="edit-field-btn" onclick="toggleInline('line')">Редактирай</button>
                </div>
            </div>

            <div id="inline-line" class="inline-field-form" style="display:none;">
                <select id="input-line" class="inline-select">
                    <option value="">Изберете линия</option>
                    <option th:each="line : ${T(lmc.configuration.model.MachineLine).values()}"
                            th:value="${line}" th:text="${line}" th:selected="${line == configuration.line}"></option>
                </select>
                <button type="button" class="change-btn" onclick="submitField('line')">Промени</button>
                <button type="button" class="finish-btn" onclick="toggleInline('line')">Откажи</button>
                <div id="feedback-line" style="color:var(--danger); font-size:0.9rem; display:none;"></div>
            </div>
        </div>

        <!-- type (enum select) -->
        <div class="detail-field">
            <label>Тип:</label>
            <div class="detail-row">
                <span id="display-type" class="detail-value" th:text="${configuration.type}">-</span>
                <div style="display:flex;gap:0.5rem;">
                    <button type="button" class="edit-field-btn" onclick="toggleInline('type')">Редактирай</button>
                </div>
            </div>

            <div id="inline-type" class="inline-field-form" style="display:none;">
                <select id="input-type" class="inline-select">
                    <option value="">Изберете тип</option>
                    <option th:each="type : ${T(lmc.configuration.model.MachineType).values()}"
                            th:value="${type}" th:text="${type}" th:selected="${type == configuration.type}"></option>
                </select>
                <button type="button" class="change-btn" onclick="submitField('type')">Промени</button>
                <button type="button" class="finish-btn" onclick="toggleInline('type')">Откажи</button>
                <div id="feedback-type" style="color:var(--danger); font-size:0.9rem; display:none;"></div>
            </div>
        </div>

        <!-- description (text) -->
        <div class="detail-field">
            <label>Описание:</label>
            <div class="detail-row">
                <span id="display-description" class="detail-value" th:text="*{description}">-</span>
                <div style="display:flex;gap:0.5rem;">
                    <button type="button" class="edit-field-btn" onclick="toggleInline('description')">Редактирай</button>
                </div>
            </div>

            <div id="inline-description" class="inline-field-form" style="display:none;">
                <input type="text" id="input-description" class="inline-input" th:value="*{description}" placeholder="Описание"/>
                <button type="button" class="change-btn" onclick="submitField('description')">Промени</button>
                <button type="button" class="finish-btn" onclick="toggleInline('description')">Откажи</button>
                <div id="feedback-description" style="color:var(--danger); font-size:0.9rem; display:none;"></div>
            </div>
        </div>

        <!-- model (text) -->
        <div class="detail-field">
            <label>Модел:</label>
            <div class="detail-row">
                <span id="display-model" class="detail-value" th:text="*{model}">-</span>
                <div style="display:flex;gap:0.5rem;">
                    <button type="button" class="edit-field-btn" onclick="toggleInline('model')">Редактирай</button>
                </div>
            </div>

            <div id="inline-model" class="inline-field-form" style="display:none;">
                <input type="text" id="input-model" class="inline-input" th:value="*{model}" placeholder="Модел"/>
                <button type="button" class="change-btn" onclick="submitField('model')">Промени</button>
                <button type="button" class="finish-btn" onclick="toggleInline('model')">Откажи</button>
                <div id="feedback-model" style="color:var(--danger); font-size:0.9rem; display:none;"></div>
            </div>
        </div>

    </div>

    <h3 class="section-title section-spaced">Елементи на конфигурацията:</h3>

    <!-- unit/templates/server-data and units container are kept identical to existing implementation -->
    <select id="unitOptionsTemplate" style="display:none">
        <option value="">Изберете unit</option>
        <option th:each="u : ${existingUnits}" th:value="${u.id}" th:text="${u.unit.code + ' - ' + u.unit.name }"></option>
    </select>

    <div id="server-data" style="display:none">
        <div th:each="cu : ${configuredUnits}" th:attr="data-unit-id=${cu.id}">
            <div th:each="co : ${cu.options}"
                 class="unit-option"
                 th:attr="data-option-id=${co.option.id},data-code=${co.option.code},data-name=${co.option.name},data-price=${co.option.price}">
            </div>
        </div>

        <div th:if="${configuration != null and configuration.units != null}">
            <div th:each="unit, idx : *{units}" th:attr="data-unit-idx=${idx.index}">
                <div th:each="sel : ${unit.optionSelections}"
                     class="sel"
                     th:attr="data-option-id=${sel.optionId},data-qty=${sel.quantity}">
                </div>
            </div>
        </div>
    </div>

    <script>
        var unitOptionsMap = {}; var initialUnitSelections = {};
        (function buildMaps(){
            document.querySelectorAll('#server-data > div[data-unit-id]').forEach(u=>{
                const id = u.getAttribute('data-unit-id');
                const options = Array.from(u.querySelectorAll('.unit-option')).map(o=>{
                    const priceAttr = o.getAttribute('data-price');
                    const price = (priceAttr === null || priceAttr === 'null' || priceAttr === '') ? null : Number(priceAttr);
                    return { optionId: o.getAttribute('data-option-id'), code: o.getAttribute('data-code'), name: o.getAttribute('data-name'), price: price };
                });
                unitOptionsMap[id] = options;
            });
            document.querySelectorAll('#server-data div[data-unit-idx]').forEach(u=>{
                const idx = u.getAttribute('data-unit-idx');
                const sels = Array.from(u.querySelectorAll('.sel')).map(s=>({ optionId: s.getAttribute('data-option-id'), quantity: Math.max(1, parseInt(s.getAttribute('data-qty')||'1',10)) }));
                initialUnitSelections[idx] = sels;
            });
        })();
    </script>

    <div id="units-container">
        <div th:each="unit, stat : *{units}" class="unit-row">
            <select th:field="*{units[__${stat.index}__].configurableUnitId}" class="unit-select" required>
                <option value="">Изберете unit</option>
                <option th:each="u : ${existingUnits}" th:value="${u.id}" th:text="${u.unit.code + ' - ' + u.unit.name }"></option>
            </select>

            <input type="number"
                   th:field="*{units[__${stat.index}__].quantity}"
                   min="1"
                   th:value="${unit.quantity}"
                   required
                   placeholder="Бр."/>

            <div class="inline-options" style="margin-left:1rem;">
                <div class="options-for-row"></div>
            </div>

            <button type="button" class="remove-btn" onclick="removeUnitRow(this)">Премахни</button>
        </div>
    </div>

    <div style="margin-top:1rem;">
        <button type="button" onclick="addUnit()">Добави Unit</button>
        <button type="button" onclick="openCreateUnitModal()">Създай нов Unit</button>
        <button type="submit">Запази</button>
        <a th:href="@{|/configurations/${configurationId}/details|}">
            <button type="button" class="finish-btn">Край</button>
        </a>
    </div>
</form>

<!-- Create Unit Modal kept as before -->
<div id="createUnitModal" style="display:none;">
    <div class="modal-content create-modal-content">
        <h3>Създай нов Configurable Unit</h3>
        <form id="createUnitForm" onsubmit="return false;">
            <input type="hidden" id="csrfToken" th:value="${_csrf.token}"/>
            <div>
                <label>Базов продукт:</label>
                <select id="newUnitBase" required>
                    <option value="">-- Изберете --</option>
                    <option th:each="unit : ${allUnits}" th:value="${unit.id}" th:text="${unit.code + ' - ' + unit.name}"></option>
                </select>
            </div>
            <div>
                <label>Опции (незадължително):</label>
                <div id="newUnitOptions">
                    <div th:each="option : ${allOptions}">
                        <input type="checkbox" th:id="'newOpt_' + ${option.id}" th:value="${option.id}" class="modal-opt"/>
                        <label th:for="'newOpt_' + ${option.id}" th:text="${option.code + ' - ' + option.name}"></label>
                        <input type="number" min="1" value="1" class="modal-opt-qty" style="width:60px"/>
                    </div>
                </div>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-create" onclick="submitNewUnit()">Създай и добави</button>
                <button type="button" class="btn-cancel" onclick="closeCreateUnitModal()">Откажи</button>
            </div>
        </form>
    </div>
</div>

<script>
    // CSRF helpers
    const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
    const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
    const csrfToken = csrfTokenMeta ? csrfTokenMeta.getAttribute('content') : null;
    const csrfHeader = csrfHeaderMeta ? csrfHeaderMeta.getAttribute('content') : 'X-CSRF-TOKEN';

    function buildHeaders(contentType='application/json') {
        const headers = { 'Content-Type': contentType, 'X-Requested-With': 'XMLHttpRequest' };
        if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
        return headers;
    }

    // retrieve configurationId from form dataset
    const cfgForm = document.getElementById('details-form');
    const configurationId = window.configurationId || (cfgForm ? cfgForm.getAttribute('data-id') : null);

    // inline edit helpers
    function toggleInline(field) {
        const el = document.getElementById('inline-' + field);
        if (!el) return;
        const open = el.style.display !== 'none' && el.style.display !== '';
        el.style.display = open ? 'none' : 'flex';
        const fb = document.getElementById('feedback-' + field);
        if (fb) { fb.style.display = 'none'; fb.textContent = ''; }
    }

    async function submitField(field) {
        const container = document.getElementById('inline-' + field);
        if (!container) return;
        const input = document.getElementById('input-' + field) || container.querySelector('input, select, textarea');
        if (!input) return;
        const value = input.value;

        try {
            const res = await fetch(`/configurations/edit/${configurationId}/field-update`, {
                method: 'POST',
                headers: buildHeaders(),
                body: JSON.stringify({ field: field, value: value })
            });
            const data = await res.json();
            if (data.status === 'ok') {
                const disp = document.getElementById('display-' + field);
                if (disp) disp.textContent = value || '';
                // update hidden binding input so full-form save remains coherent
                const hidden = document.getElementById('hidden-' + field);
                if (hidden) hidden.value = value || '';
                toggleInline(field);
            } else {
                const fb = document.getElementById('feedback-' + field);
                if (fb) { fb.style.display = 'block'; fb.textContent = data.message || 'Error'; }
            }
        } catch (err) {
            const fb = document.getElementById('feedback-' + field);
            if (fb) { fb.style.display = 'block'; fb.textContent = err.message || 'Network error'; }
        }
    }

    // --- Units / configured units JS (kept from existing implementation) ---
    const unitTemplate = document.getElementById('unitOptionsTemplate');
    const unitsContainer = document.getElementById('units-container');

    function addUnit() {
        const div = document.createElement('div'); div.className = 'unit-row';
        const select = document.createElement('select'); select.className = 'unit-select'; select.required = true;
        select.innerHTML = unitTemplate.innerHTML;
        const qty = document.createElement('input'); qty.type = 'number'; qty.min = '1'; qty.value = '1'; qty.required = true; qty.placeholder = 'Бр.';
        const optionsWrapper = document.createElement('div'); optionsWrapper.className = 'inline-options';
        const optionsInner = document.createElement('div'); optionsInner.className = 'options-for-row'; optionsWrapper.appendChild(optionsInner);
        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'remove-btn'; btn.textContent = 'Премахни';
        btn.addEventListener('click', () => { div.remove(); reindexUnits(); });
        div.appendChild(select); div.appendChild(qty); div.appendChild(optionsWrapper); div.appendChild(btn);
        select.addEventListener('change', () => renderOptionsForRow(div, select.value));
        unitsContainer.appendChild(div); reindexUnits();
    }

    function removeUnitRow(btn) { const row = btn.closest('.unit-row'); if (row) { row.remove(); reindexUnits(); } }

    function renderOptionsForRow(rowElement, unitId) {
        const container = rowElement.querySelector('.options-for-row'); container.innerHTML = '';
        if (!unitId || !unitOptionsMap[unitId] || unitOptionsMap[unitId].length === 0) return;
        unitOptionsMap[unitId].forEach(opt => {
            const row = document.createElement('div'); row.style.display = 'flex'; row.style.alignItems = 'center'; row.style.gap = '0.4rem'; row.style.marginBottom = '0.25rem';
            const cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'opt-cb'; cb.dataset.optionId = opt.optionId;
            const label = document.createElement('label'); label.textContent = (opt.code ? opt.code + ' - ' : '') + (opt.name || '') + (opt.price != null ? ' (' + opt.price + ' EUR)' : '');
            const qty = document.createElement('input'); qty.type = 'number'; qty.min = '1'; qty.value = '1'; qty.className = 'opt-qty'; qty.style.width = '70px'; qty.disabled = true; qty.dataset.optionId = opt.optionId;
            cb.addEventListener('change', () => { qty.disabled = !cb.checked; });
            row.appendChild(cb); row.appendChild(label); row.appendChild(qty); container.appendChild(row);
        });
    }

    function reindexUnits() {
        const rows = Array.from(document.querySelectorAll('#units-container .unit-row'));
        rows.forEach((row, i) => {
            const select = row.querySelector('.unit-select');
            const qty = row.querySelector('input[type="number"]:not(.opt-qty)');
            if (select) select.name = `units[${i}].configurableUnitId`;
            if (qty) qty.name = `units[${i}].quantity`;
            Array.from(row.querySelectorAll('input[type="hidden"].option-selection')).forEach(h => h.remove());
        });
    }

    function prepareOptionSelections() {
        reindexUnits();
        const rows = Array.from(document.querySelectorAll('#units-container .unit-row'));
        rows.forEach((row, i) => {
            Array.from(row.querySelectorAll('input[type="hidden"].option-selection')).forEach(h => h.remove());
            const checkedRows = Array.from(row.querySelectorAll('.options-for-row div')).filter(r => {
                const cb = r.querySelector('.opt-cb'); return cb && cb.checked;
            });
            checkedRows.forEach((r, j) => {
                const cb = r.querySelector('.opt-cb');
                const q = r.querySelector('.opt-qty');
                const optionId = cb.dataset.optionId;
                const quantity = Math.max(1, parseInt(q.value || '1', 10));
                const hidOption = document.createElement('input'); hidOption.type = 'hidden'; hidOption.className = 'option-selection';
                hidOption.name = `units[${i}].optionSelections[${j}].optionId`; hidOption.value = optionId;
                const hidQty = document.createElement('input'); hidQty.type = 'hidden'; hidQty.className = 'option-selection';
                hidQty.name = `units[${i}].optionSelections[${j}].quantity`; hidQty.value = quantity;
                row.appendChild(hidOption); row.appendChild(hidQty);
            });
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        // initial units render and apply existing selections
        document.querySelectorAll('#units-container .unit-row').forEach((row, index) => {
            const select = row.querySelector('.unit-select');
            if (select) {
                renderOptionsForRow(row, select.value);
                const sel = initialUnitSelections && initialUnitSelections[index];
                if (Array.isArray(sel)) sel.forEach(s => {
                    try {
                        const cb = row.querySelector(`.options-for-row .opt-cb[data-option-id="${s.optionId}"]`);
                        const q = row.querySelector(`.options-for-row .opt-qty[data-option-id="${s.optionId}"]`);
                        if (cb) { cb.checked = true; if (q) { q.value = Math.max(1, Number(s.quantity) || 1); q.disabled = false; } }
                    } catch (e) {}
                });
                select.addEventListener('change', () => renderOptionsForRow(row, select.value));
            }
        });
        reindexUnits();
    });

    // Create unit modal + submitNewUnit (keeps previous endpoints)
    function openCreateUnitModal() { document.getElementById('createUnitModal').style.display = 'block'; }
    function closeCreateUnitModal() { document.getElementById('createUnitModal').style.display = 'none'; document.getElementById('createUnitForm').reset(); }

    async function submitNewUnit() {
        const unitId = document.getElementById('newUnitBase').value;
        if (!unitId) { alert('Моля изберете базов продукт'); return; }
        const rows = Array.from(document.querySelectorAll('#newUnitOptions div'));
        const options = rows.map(row => {
            const cb = row.querySelector('input[type="checkbox"]');
            const qtyInput = row.querySelector('input[type="number"]');
            return cb && cb.checked ? { optionId: cb.value, quantity: Number(qtyInput.value) || 1 } : null;
        }).filter(x => x !== null);

        try {
            const res = await fetch('/configurable-units/create', {
                method: 'POST',
                headers: buildHeaders(),
                body: JSON.stringify({ unitId: unitId, optionSelections: options.length ? options : null })
            });
            if (!res.ok) throw new Error('Network error');
            const newUnit = await res.json();

            if (unitTemplate) {
                const opt = document.createElement('option');
                opt.value = newUnit.id;
                opt.textContent = (newUnit.unit && newUnit.unit.code ? newUnit.unit.code : '') + ' - ' + (newUnit.unit && newUnit.unit.name ? newUnit.unit.name : '');
                unitTemplate.appendChild(opt);
            }
            document.querySelectorAll('#units-container select').forEach(select => {
                const opt = document.createElement('option');
                opt.value = newUnit.id;
                opt.textContent = (newUnit.unit && newUnit.unit.code ? newUnit.unit.code : '') + ' - ' + (newUnit.unit && newUnit.unit.name ? newUnit.unit.name : '');
                select.appendChild(opt);
            });

            closeCreateUnitModal();
            alert('Unit създаден успешно!');
            window.location.reload();
        } catch (err) {
            console.error(err);
            alert('Грешка при създаване: ' + err.message);
        }
    }
</script>

</body>
</html>
