<!-- File: src/main/resources/templates/edit-configuration.html -->
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="bg">
<head>
    <meta charset="UTF-8"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Edit Configuration</title>
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/edit-configuration.css?v=1.0">
</head>
<body>
<div class="header-container">
    <th:block th:insert="~{fragments/nav :: nav}"></th:block>
</div>

<h1 class="page-title"
    th:text="|Редактиране на ${configuration.model} ${configuration.description}|">Редактиране на конфигурация</h1>

<form id="details-form" th:action="@{|/configurations/edit/${configurationId}|}" th:object="${configuration}" th:attr="data-id=${configurationId}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <!-- Hidden bind inputs so full "Запази" submit works without visible th:field duplicates -->
    <input type="hidden" th:field="*{imgUrl}" id="hidden-imgUrl"/>
    <input type="hidden" th:field="*{code}" id="hidden-code"/>
    <input type="hidden" th:field="*{line}" id="hidden-line"/>
    <input type="hidden" th:field="*{type}" id="hidden-type"/>
    <input type="hidden" th:field="*{description}" id="hidden-description"/>
    <input type="hidden" th:field="*{model}" id="hidden-model"/>

    <!-- Section title for Details -->
    <h2 class="section-title">Детайли:</h2>

    <div class="details-grid">

        <div class="detail-field">
            <label>Линк на изображението:</label>
            <div class="detail-row">
                <span class="detail-value" th:text="${configuration.imgUrl}">-</span>
                <button type="button" class="edit-field-btn" onclick="toggleInlineField(this)">Редактирай</button>
            </div>
            <div class="inline-field-form" data-field="imgUrl">
                <input type="text" name="imgUrl" th:value="${configuration.imgUrl}" class="inline-input"/>
                <button type="button" class="change-btn" onclick="submitInlineField(this)">Промени</button>
            </div>
        </div>

        <div class="detail-field">
            <label>Код:</label>
            <div class="detail-row">
                <span class="detail-value" th:text="${configuration.code}">-</span>
                <button type="button" class="edit-field-btn" onclick="toggleInlineField(this)">Редактирай</button>
            </div>
            <div class="inline-field-form" data-field="code">
                <input type="text" name="code" th:value="${configuration.code}" class="inline-input"/>
                <button type="button" class="change-btn" onclick="submitInlineField(this)">Промени</button>
            </div>
        </div>

        <div class="detail-field">
            <label>Линия:</label>
            <div class="detail-row">
                <span class="detail-value" th:text="${configuration.line}">-</span>
                <button type="button" class="edit-field-btn" onclick="toggleInlineField(this)">Редактирай</button>
            </div>
            <div class="inline-field-form" data-field="line">
                <select name="line" class="inline-select">
                    <option th:each="l : ${T(lmc.configuration.model.MachineLine).values()}"
                            th:value="${l}" th:text="${l}" th:selected="${l == configuration.line}"></option>
                </select>
                <button type="button" class="change-btn" onclick="submitInlineField(this)">Промени</button>
            </div>
        </div>

        <div class="detail-field">
            <label>Тип:</label>
            <div class="detail-row">
                <span class="detail-value" th:text="${configuration.type}">-</span>
                <button type="button" class="edit-field-btn" onclick="toggleInlineField(this)">Редактирай</button>
            </div>
            <div class="inline-field-form" data-field="type">
                <select name="type" class="inline-select">
                    <option th:each="t : ${T(lmc.configuration.model.MachineType).values()}"
                            th:value="${t}" th:text="${t}" th:selected="${t == configuration.type}"></option>
                </select>
                <button type="button" class="change-btn" onclick="submitInlineField(this)">Промени</button>
            </div>
        </div>

        <div class="detail-field">
            <label>Описание:</label>
            <div class="detail-row">
                <span class="detail-value" th:text="${configuration.description}">-</span>
                <button type="button" class="edit-field-btn" onclick="toggleInlineField(this)">Редактирай</button>
            </div>
            <div class="inline-field-form" data-field="description">
                <textarea name="description" class="inline-textarea" th:text="${configuration.description}"></textarea>
                <button type="button" class="change-btn" onclick="submitInlineField(this)">Промени</button>
            </div>
        </div>

        <div class="detail-field">
            <label>Модел:</label>
            <div class="detail-row">
                <span class="detail-value" th:text="${configuration.model}">-</span>
                <button type="button" class="edit-field-btn" onclick="toggleInlineField(this)">Редактирай</button>
            </div>
            <div class="inline-field-form" data-field="model">
                <input type="text" name="model" th:value="${configuration.model}" class="inline-input"/>
                <button type="button" class="change-btn" onclick="submitInlineField(this)">Промени</button>
            </div>
        </div>

    </div> <!-- /.details-grid -->

    <!-- Units section title: blue and spaced down only before the heading -->
    <h3 class="section-title section-spaced">Елементи на конфигурацията:</h3>

    <div id="units-list">
        <div th:each="u,iterStat : *{units}" class="unit-row">
            <div class="unit-content">
                <span th:text="${u.displayLabel != null && u.displayLabel != '' ? u.displayLabel : u.configurableUnitId}">unit-label</span>
                <span> - </span>
                <span> к-во: <span th:text="${u.quantity}">1</span></span>
            </div>
            <button type="button" th:attr="data-id=${u.configurableUnitId}" onclick="removeUnit(this)">Премахни 1бр.</button>
        </div>
    </div>

    <h4>Добави елемент</h4>
    <div class="add-controls">
        <select id="add-unit-select">
            <option th:each="cu : ${existingUnits}" th:value="${cu.id}" th:text="${cu.code + ' - ' + (cu.unit != null ? cu.unit.name : '')}"></option>
        </select>
        <input id="add-qty" type="number" value="1" min="1"/>
        <button type="button" onclick="addUnit()">Добави</button>
    </div>

    <div style="margin-top:1rem;">
        <a th:href="@{|/configurations/${configurationId}/details|}">
            <button type="button" class="finish-btn">Край</button>
        </a>
    </div>
</form>

<script th:inline="javascript">
    /*<![CDATA[*/
    const configurationId = (/*[[${configurationId}]]*/ '') || document.querySelector('form#details-form').dataset.id;
    const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
    const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
    const csrfToken = csrfTokenMeta ? csrfTokenMeta.getAttribute('content') : null;
    const csrfHeader = csrfHeaderMeta ? csrfHeaderMeta.getAttribute('content') : 'X-CSRF-TOKEN';

    function buildHeaders(contentType='application/x-www-form-urlencoded') {
        const headers = {
            'Content-Type': contentType,
            'X-Requested-With': 'XMLHttpRequest'
        };
        if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
        return headers;
    }

    function toggleInlineField(buttonEl) {
        const fieldBlock = buttonEl.closest('.detail-field');
        if (!fieldBlock) return;
        const inline = fieldBlock.querySelector('.inline-field-form');
        if (!inline) return;
        inline.classList.toggle('open');
    }

    function submitInlineField(buttonEl) {
        const block = buttonEl.closest('.inline-field-form');
        if (!block) return;

        const form = document.getElementById('details-form');
        if (!form) return;

        const fieldName = block.dataset.field;
        const input = block.querySelector('input[name], select[name], textarea[name]');
        const newValue = input ? input.value : '';

        const hidden = document.getElementById('hidden-' + fieldName);
        if (hidden) {
            hidden.value = newValue;
        } else {
            const created = document.createElement('input');
            created.type = 'hidden';
            created.name = fieldName;
            created.id = 'hidden-' + fieldName;
            created.value = newValue;
            form.appendChild(created);
        }

        const inlineNamed = form.querySelectorAll('.inline-field-form [name]');
        inlineNamed.forEach(el => { el.dataset._origName = el.name; el.removeAttribute('name'); });

        const detailBlock = block.closest('.detail-field');
        if (detailBlock) {
            const span = detailBlock.querySelector('.detail-value');
            if (span) span.textContent = newValue || '-';
            block.classList.remove('open');
        }

        const fm = new FormData(form);
        const bodyStr = new URLSearchParams(fm).toString();

        fetch('/configurations/edit/' + configurationId, {
            method: 'POST',
            headers: buildHeaders('application/x-www-form-urlencoded;charset=UTF-8'),
            body: bodyStr,
            credentials: 'same-origin'
        }).then(resp => {
            if (resp.ok) {
                location.reload();
            } else {
                inlineNamed.forEach(el => {
                    if (el.dataset._origName) el.name = el.dataset._origName;
                    delete el.dataset._origName;
                });
                resp.text().then(t => alert('Update failed. Server response snippet:\n' + (t ? t.substring(0, 300) : '')));
            }
        }).catch(err => {
            console.error('inline update error', err);
            inlineNamed.forEach(el => {
                if (el.dataset._origName) el.name = el.dataset._origName;
                delete el.dataset._origName;
            });
            alert('Network error when updating field');
        });
    }

    function addUnit() {
        const cuId = document.getElementById('add-unit-select').value;
        const qty = parseInt(document.getElementById('add-qty').value || '1', 10);
        if (!cuId) { alert('Моля изберете елемент'); return; }
        fetch('/configurations/' + configurationId + '/units/add', {
            method: 'POST',
            headers: buildHeaders('application/json'),
            body: JSON.stringify({configurableUnitId: cuId, quantity: qty})
        }).then(r => {
            if (!r.ok) throw new Error('Server error');
            return r.json();
        }).then(() => location.reload())
            .catch(e => { console.error(e); alert('Error adding unit') });
    }

    function removeUnit(btn) {
        const cuId = btn.getAttribute('data-id');
        if (!cuId) { alert('Няма id'); return; }
        fetch('/configurations/' + configurationId + '/units/remove', {
            method: 'POST',
            headers: buildHeaders('application/json'),
            body: JSON.stringify({configurableUnitId: cuId, quantity: 1})
        }).then(r => {
            if (!r.ok) throw new Error('Server error');
            return r.json();
        }).then(() => location.reload())
            .catch(e => { console.error(e); alert('Error removing unit') });
    }
    /*]]>*/
</script>

</body>
</html>
