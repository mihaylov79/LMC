<!-- language: html -->
<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Нова конфигурация</title>
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/new-configuration.css">
</head>
<body>

<div class="header-container">
    <th:block th:insert="~{fragments/nav :: nav}"></th:block>
</div>

<div class="form">
    <form id="create-form" th:action="@{/configurations/create/new}" th:object="${configuration}" method="post" onsubmit="prepareOptionSelections();">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <h2>Създаване на нова конфигурация</h2>

        <div class="field">
            <label for="imgUrl">URL на изображение:</label>
            <input type="text" id="imgUrl" th:field="*{imgUrl}" placeholder="URL на изображение"/>
        </div>

        <div class="field">
            <label for="code">Код:</label>
            <input type="text" id="code" th:field="*{code}" placeholder="Код" required/>
        </div>

        <div class="field">
            <label for="line">Линия:</label>
            <select id="line" th:field="*{line}" required>
                <option value="">Изберете линия</option>
                <option th:each="line : ${T(lmc.configuration.model.MachineLine).values()}"
                        th:value="${line}" th:text="${line}"></option>
            </select>
        </div>

        <div class="field">
            <label for="type">Тип:</label>
            <select id="type" th:field="*{type}" required>
                <option value="">Изберете тип</option>
                <option th:each="type : ${T(lmc.configuration.model.MachineType).values()}"
                        th:value="${type}" th:text="${type}"></option>
            </select>
        </div>

        <div class="field">
            <label for="description">Описание:</label>
            <input type="text" id="description" th:field="*{description}" placeholder="Описание"/>
        </div>

        <div class="field">
            <label for="model">Модел:</label>
            <input type="text" id="model" th:field="*{model}" placeholder="Модел"/>
        </div>

        <h3>Units</h3>

        <!-- Hidden template for units select options -->
        <select id="unitOptionsTemplate" style="display:none">
            <option value="">Изберете unit</option>
            <option th:each="u : ${existingUnits}"
                    th:value="${u.id}"
                    th:text="${u.unit.code + ' - ' + u.unit.name }">
            </option>
        </select>

        <!-- Server-rendered hidden DOM used to build JS maps (safe Thymeleaf usage) -->
        <div id="server-data" style="display:none">
            <!-- iterate only configured units (they have `options`) -->
            <div th:each="cu : ${configuredUnits}" th:attr="data-unit-id=${cu.id}">
                <div th:each="co : ${cu.options}"
                     class="unit-option"
                     th:attr="data-option-id=${co.option.id}, data-code=${co.option.code}, data-name=${co.option.name}, data-price=${co.option.price}">
                </div>
            </div>

            <div th:if="${configuration != null and configuration.units != null}">
                <div th:each="unit, idx : *{units}" th:attr="data-unit-idx=${idx.index}">
                    <div th:each="sel : ${unit.optionSelections}"
                         class="sel"
                         th:attr="data-option-id=${sel.optionId}, data-qty=${sel.quantity}">
                    </div>
                </div>
            </div>
        </div>

        <!-- Build JS maps from the hidden DOM (no thymeleaf inlined JS) -->
        <script>
            var unitOptionsMap = {};
            var initialUnitSelections = {};

            (function buildMaps() {
                // units -> options
                document.querySelectorAll('#server-data > div[data-unit-id]').forEach(u => {
                    const id = u.getAttribute('data-unit-id');
                    const options = Array.from(u.querySelectorAll('.unit-option')).map(o => {
                        const priceAttr = o.getAttribute('data-price');
                        const price = (priceAttr === null || priceAttr === 'null' || priceAttr === '') ? null : Number(priceAttr);
                        return {
                            optionId: o.getAttribute('data-option-id'),
                            code: o.getAttribute('data-code'),
                            name: o.getAttribute('data-name'),
                            price: price
                        };
                    });
                    unitOptionsMap[id] = options;
                });

                // initial selections for edit/prefill
                document.querySelectorAll('#server-data div[data-unit-idx]').forEach(u => {
                    const idx = u.getAttribute('data-unit-idx');
                    const sels = Array.from(u.querySelectorAll('.sel')).map(s => ({
                        optionId: s.getAttribute('data-option-id'),
                        quantity: Math.max(1, parseInt(s.getAttribute('data-qty') || '1', 10))
                    }));
                    initialUnitSelections[idx] = sels;
                });
            })();
        </script>

        <!-- Units container -->
        <div id="units-container">
            <div th:each="unit, stat : *{units}" class="unit-row">
                <select th:field="*{units[__${stat.index}__].configurableUnitId}" class="unit-select" required>
                    <option value="">Изберете unit</option>
                    <option th:each="u : ${existingUnits}"
                            th:value="${u.id}"
                            th:text="${u.unit.code + ' - ' + u.unit.name}">
                    </option>
                </select>

                <input type="number"
                       th:field="*{units[__${stat.index}__].quantity}"
                       min="1"
                       value="1"
                       required
                       placeholder="Бр."/>

                <!-- options panel for this row (will be filled by JS) -->
                <div class="inline-options" style="margin-left:1rem;">
                    <div class="options-for-row"></div>
                </div>

                <button type="button" class="remove-btn" onclick="removeUnit(this)">Премахни</button>
            </div>
        </div>

        <button type="button" onclick="addUnit()">Добави Unit</button>
        <button type="button" onclick="openCreateUnitModal()">Създай нов Unit</button>
        <button type="submit">Запази</button>
    </form>
</div>

<!-- Modal for creating a new configurable unit -->
<div id="createUnitModal" style="display:none;">
    <div class="modal-content">
        <h3>Създай нов Configurable Unit</h3>
        <form id="createUnitForm" onsubmit="return false;">
            <div>
                <label>Базов продукт:</label>
                <select id="newUnitBase" required>
                    <option value="">-- Изберете --</option>
                    <option th:each="unit : ${allUnits}"
                            th:value="${unit.id}"
                            th:text="${unit.code + ' - ' + unit.name}">
                    </option>
                </select>
            </div>
            <div>
                <label>Опции (незадължително):</label>
                <div id="newUnitOptions">
                    <div th:each="option : ${allOptions}">
                        <input type="checkbox" th:id="'newOpt_' + ${option.id}" th:value="${option.id}" class="modal-opt"/>
                        <label th:for="'newOpt_' + ${option.id}" th:text="${option.code + ' - ' + option.name}"></label>
                        <input type="number" min="1" value="1" class="modal-opt-qty" style="width:60px"/>
                    </div>
                </div>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-create" onclick="submitNewUnit()">Създай и добави</button>
                <button type="button" class="btn-cancel" onclick="closeCreateUnitModal()">Откажи</button>
            </div>
        </form>
    </div>
</div>

<script>
    const unitTemplate = document.getElementById('unitOptionsTemplate');
    const unitsContainer = document.getElementById('units-container');

    function addUnit() {
        const div = document.createElement('div');
        div.className = 'unit-row';

        const select = document.createElement('select');
        select.className = 'unit-select';
        select.required = true;
        select.innerHTML = unitTemplate.innerHTML;

        const qty = document.createElement('input');
        qty.type = 'number';
        qty.min = '1';
        qty.value = '1';
        qty.required = true;
        qty.placeholder = 'Бр.';

        const optionsWrapper = document.createElement('div');
        optionsWrapper.className = 'inline-options';
        const optionsInner = document.createElement('div');
        optionsInner.className = 'options-for-row';
        optionsWrapper.appendChild(optionsInner);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'remove-btn';
        btn.textContent = 'Премахни';
        btn.addEventListener('click', () => { div.remove(); reindexUnits(); });

        div.appendChild(select);
        div.appendChild(qty);
        div.appendChild(optionsWrapper);
        div.appendChild(btn);

        select.addEventListener('change', () => renderOptionsForRow(div, select.value));

        unitsContainer.appendChild(div);
        reindexUnits();
    }

    function removeUnit(btn) {
        const row = btn.closest('.unit-row');
        if (row) { row.remove(); reindexUnits(); }
    }

    function renderOptionsForRow(rowElement, unitId) {
        const container = rowElement.querySelector('.options-for-row');
        container.innerHTML = '';
        if (!unitId || !unitOptionsMap[unitId] || unitOptionsMap[unitId].length === 0) {
            return;
        }
        unitOptionsMap[unitId].forEach(opt => {
            const row = document.createElement('div');
            row.style.display = 'flex';
            row.style.alignItems = 'center';
            row.style.gap = '0.4rem';
            row.style.marginBottom = '0.25rem';

            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'opt-cb';
            cb.dataset.optionId = opt.optionId;

            const label = document.createElement('label');
            label.textContent = (opt.code ? opt.code + ' - ' : '') + (opt.name || '') + (opt.price != null ? ' (' + opt.price + ' EUR)' : '');

            const qty = document.createElement('input');
            qty.type = 'number';
            qty.min = '1';
            qty.value = '1';
            qty.className = 'opt-qty';
            qty.style.width = '70px';
            qty.disabled = true;

            qty.dataset.optionId = opt.optionId;

            cb.addEventListener('change', () => { qty.disabled = !cb.checked; });

            row.appendChild(cb);
            row.appendChild(label);
            row.appendChild(qty);
            container.appendChild(row);
        });
    }

    function renderOptionsForUnit(unitId) {
        const optionsList = document.getElementById('options-list');
        if (!optionsList) return;
        optionsList.innerHTML = '';
        if (!unitId || !unitOptionsMap[unitId] || unitOptionsMap[unitId].length === 0) {
            document.getElementById('options-panel').style.display = 'none';
            return;
        }
        document.getElementById('options-panel').style.display = 'block';
        unitOptionsMap[unitId].forEach(opt => {
            const row = document.createElement('div');
            row.className = 'option-row';
            row.style.display = 'flex';
            row.style.alignItems = 'center';
            row.style.gap = '0.5rem';
            row.style.marginBottom = '0.4rem';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'option-checkbox';
            checkbox.dataset.optionId = opt.optionId;

            const label = document.createElement('label');
            label.textContent = (opt.code ? opt.code + ' - ' : '') + (opt.name || '') + (opt.price ? ' (' + opt.price + ' EUR)' : '');

            const qty = document.createElement('input');
            qty.type = 'number';
            qty.min = '1';
            qty.value = '1';
            qty.className = 'option-qty';
            qty.style.width = '70px';
            qty.style.marginLeft = 'auto';
            qty.dataset.optionId = opt.optionId;

            row.appendChild(checkbox);
            row.appendChild(label);
            row.appendChild(qty);
            optionsList.appendChild(row);

            checkbox.addEventListener('change', () => { qty.disabled = !checkbox.checked; });
            qty.disabled = true;
        });
    }

    function reindexUnits() {
        const rows = Array.from(document.querySelectorAll('#units-container .unit-row'));
        rows.forEach((row, i) => {
            const select = row.querySelector('.unit-select');
            const qty = row.querySelector('input[type="number"]:not(.opt-qty)');

            if (select) select.name = `units[${i}].configurableUnitId`;
            if (qty) qty.name = `units[${i}].quantity`;

            Array.from(row.querySelectorAll('input[type="hidden"].option-selection')).forEach(h => h.remove());
        });
    }

    function prepareOptionSelections() {
        reindexUnits();
        const rows = Array.from(document.querySelectorAll('#units-container .unit-row'));
        rows.forEach((row, i) => {
            Array.from(row.querySelectorAll('input[type="hidden"].option-selection')).forEach(h => h.remove());

            const checkedRows = Array.from(row.querySelectorAll('.options-for-row div')).filter(r => {
                const cb = r.querySelector('.opt-cb');
                return cb && cb.checked;
            });

            checkedRows.forEach((r, j) => {
                const cb = r.querySelector('.opt-cb');
                const q = r.querySelector('.opt-qty');
                const optionId = cb.dataset.optionId;
                const quantity = Math.max(1, parseInt(q.value || '1', 10));

                const hidOption = document.createElement('input');
                hidOption.type = 'hidden';
                hidOption.className = 'option-selection';
                hidOption.name = `units[${i}].optionSelections[${j}].optionId`;
                hidOption.value = optionId;

                const hidQty = document.createElement('input');
                hidQty.type = 'hidden';
                hidQty.className = 'option-selection';
                hidQty.name = `units[${i}].optionSelections[${j}].quantity`;
                hidQty.value = quantity;

                row.appendChild(hidOption);
                row.appendChild(hidQty);
            });
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('#units-container .unit-row').forEach((row, index) => {
            const select = row.querySelector('.unit-select');
            if (select) {
                renderOptionsForRow(row, select.value);

                const sel = initialUnitSelections && initialUnitSelections[index];
                if (Array.isArray(sel)) {
                    sel.forEach(s => {
                        try {
                            const cb = row.querySelector(`.options-for-row .opt-cb[data-option-id="${s.optionId}"]`);
                            const q = row.querySelector(`.options-for-row .opt-qty[data-option-id="${s.optionId}"]`);
                            if (cb) {
                                cb.checked = true;
                                if (q) { q.value = Math.max(1, Number(s.quantity) || 1); q.disabled = false; }
                            }
                        } catch (e) { /* ignore invalid/missing entries */ }
                    });
                }

                select.addEventListener('change', () => renderOptionsForRow(row, select.value));
            }
        });
        reindexUnits();
    });

    window.openCreateUnitModal = function () {
        document.getElementById('createUnitModal').style.display = 'block';
    };
    window.closeCreateUnitModal = function () {
        document.getElementById('createUnitModal').style.display = 'none';
        document.getElementById('createUnitForm').reset();
    };

    window.submitNewUnit = function () {
        const unitId = document.getElementById('newUnitBase').value;
        const rows = Array.from(document.querySelectorAll('#newUnitOptions div'));
        const options = rows.map(row => {
            const cb = row.querySelector('input[type="checkbox"]');
            const qtyInput = row.querySelector('input[type="number"]');
            return cb && cb.checked ? { optionId: cb.value, quantity: Number(qtyInput.value) || 1 } : null;
        }).filter(x => x !== null);

        if (!unitId) {
            alert('Моля изберете базов продукт');
            return;
        }

        const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
        const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
        const csrfToken = csrfTokenMeta ? csrfTokenMeta.getAttribute('content') : null;
        const csrfHeader = csrfHeaderMeta ? csrfHeaderMeta.getAttribute('content') : 'X-CSRF-TOKEN';

        fetch('/products/configurable-units/create-new', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
            body: JSON.stringify({
                unitId: unitId,
                optionSelections: options.length ? options : null
            })
        })
            .then(response => {
                if (!response.ok) throw new Error('Network error');
                return response.json();
            })
            .then(newUnit => {
                if (unitTemplate) {
                    const opt = document.createElement('option');
                    opt.value = newUnit.id;
                    opt.textContent = newUnit.unit.code + ' - ' + newUnit.unit.name;
                    unitTemplate.appendChild(opt);
                }
                document.querySelectorAll('#units-container select').forEach(select => {
                    const opt = document.createElement('option');
                    opt.value = newUnit.id;
                    opt.textContent = newUnit.unit.code + ' - ' + newUnit.unit.name;
                    select.appendChild(opt);
                });

                closeCreateUnitModal();
                alert('Unit създаден успешно!');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Грешка при създаване: ' + error.message);
            });
    };
</script>

</body>
</html>
